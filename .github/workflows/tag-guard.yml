name: PuXian Tag Guard

# ============================================================
# 发布 tag 守卫（qg-issue 86）
# ------------------------------------------------------------
# 为什么需要：本仓发布**完全由 tag 驱动** —— release.yml 的触发条件只有
#   on: push: tags: ['v*']
# ⇒「推了 main」不等于「发了一版」。2026-09-17 实况：M126/M127/M128 连续三个
#   里程碑只推 main、一个 tag 都没打，而 main 与全部门/CI **全绿** ——
#   唯一信号是本源自己去翻 Releases 页（最新仍是 v0.2.0-m125）。
# 本工作流把「最高里程碑缺 tag」变成一次**红的 run**，并把处置命令写进 run 摘要。
#
# 触发设计：
#   · schedule  —— 主检测路径。每天一次，不受「刚推上来还没打 tag」窗口影响。
#   · push(main) —— 窗口期检查，用 --grace-min 45 跳过刚推上来的提交；
#                   覆盖「几天后又有一次 main 推送、里程碑仍缺 tag」的情形。
#   · workflow_dispatch —— 随时手动复核。
# ⚠️ 已知边界：GitHub 会在仓库 **60 天无活动后停用定时工作流**（且不告警）
#    ⇒ 长期静默后请手动 dispatch 一次，或把守卫挂到自有巡检上。
# ============================================================

on:
  schedule:
    - cron: '17 1 * * *'   # 每天 09:17 CST（UTC+8）
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tag-guard:
    name: 最高里程碑必须有 v*-m<NNN> 发布 tag
    runs-on: ubuntu-latest
    # M195（第 73 轮 · 实测事故）：原为 5 分钟 —— run 35894349208（M194 · 1dce657）
    #   在 17:15:29 起跑、17:20:32 被判 **cancelled**，正好 5 分钟 ⇒ 是 **timeout-minutes
    #   被超**（GitHub 超时是把 job 判 cancelled，不是 failure ⇒ 看上去像"被取消"，
    #   很容易误读成排队互踩）。根因：`fetch-depth: 0`（必须 0，否则没有 tag 与历史，
    #   守卫会判 rc=2）+ 本仓历史里带着每轮重烘的 bootstrap 二进制（单件 6–10MB，
    #   14 件/轮）⇒ **全量克隆**越来越慢，5 分钟已到边缘。
    #   ⇒ 放宽到 20 分钟（守卫本身 O(1)，几乎全部时间花在 clone 上）。
    #   **纪律（同族）：门的"红"必须能读出真因** —— 超时不是"守卫判红"，
    #   别把它记成"里程碑缺 tag"。
    timeout-minutes: 20
    steps:
      - name: 检出代码（含全部 tag 与历史）
        uses: actions/checkout@v4
        with:
          # ⚠️ 必须 0：默认浅克隆**既没有 tag 也没有历史** ⇒ 守卫会判 rc=2
          fetch-depth: 0

      - name: 跑守卫（push 触发带 180 分钟窗口，定时触发 0 窗口）
        env:
          # push：刚推上来的提交允许「tag 还没打」，避免正常发布流程误报。
          # M215 收尾（2026-09-26 实测事故）：原为 45 —— 而本仓的**正常轮次**是
          #   「先 commit（全量门 m116 拒绝脏树）→ 跑 m116 全量门（实测 ~70 分钟）
          #     → 再 push」，commit 与 push 天然隔着 **80+ 分钟** ⇒ 45 分钟窗口
          #   **必然被突破**、push 触发的 run **必然误红**（实测：16:45 commit →
          #   18:08 push，年龄 83 分钟）。⇒ 放宽到 180 分钟，覆盖「提交→跑全门→推送」。
          #   ⚠️ 真正的强制路径是**每日定时**（GRACE_MIN=0），窗口只服务于"别在正常
          #     发布节奏里误报"；守卫本身另会无条件打印"距今年龄"（判红时读得出真因）。
          GRACE_MIN: ${{ github.event_name == 'push' && '180' || '0' }}
        run: |
          set -o pipefail
          bash packaging/tag_guard.sh --ref "$GITHUB_SHA" --grace-min "$GRACE_MIN" 2>&1 \
            | tee "$RUNNER_TEMP/tag_guard.log"

      - name: 失败时写摘要（含可直接复制的处置命令）
        if: failure()
        run: |
          {
            echo "### ❌ 发布 tag 守卫未通过"
            echo ""
            echo "发布只由 tag 驱动（\`on: push: tags: ['v*']\`）—— 推 main 不会发布任何东西。"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/tag_guard.log" 2>/dev/null || echo "(无日志)"
            echo '```'
            echo ""
            echo "SOP: \`docs/RELEASE_PROCESS.md\`（守卫一节）"
          } >> "$GITHUB_STEP_SUMMARY"
