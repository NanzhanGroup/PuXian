          python3 selfhost/check_stdlib_loops.py --root . --allow selfhost/stdlib_loops.allow
          # 门（CI 档：负控跳过 —— 负控要改源码 + 重编，成本高）
          NEG_SKIP=1 bash examples/m279_std_surface/verify.sh > /tmp/v_m279.log 2>&1 || { echo "❌ m279 门失败（静态扫描 / chunk 限时响亮 / 三轨对拍）"; grep -E '^  ❌' /tmp/v_m279.log | tail -20; export GHA_ANNOTATION_FAIL=1; exit 1; }
