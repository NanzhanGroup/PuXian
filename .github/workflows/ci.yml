          echo "✅ m280_resource_baseline（收敛判据 · CPU/RSS/线程/fd 四项 · 负控忙自旋判红）PASS"

      - name: m282_registry_020（上游 0.2.0 全量再引入 + 凭据泄漏守卫）
        run: |
          set -o pipefail
          # M282：① 上游 0.2.0 全量引入（120 个新版本目录 + 110 个新用例）
          #   ② 安全（缺陷 488）：引入器曾把带 PAT 的 clone URL 原样写进公开的 THIRD_PARTY.md
          #   ③ 运行器判据缺口：成功判据过窄（要求字面 PASS）· 清单/登记**单向**检查
          # CI 档：负控跳过（NC-A/NC-C 走独立临时目录、NC-B 走 EXPECTED 副本 —— 都不改仓库，
          #   但为与其它门同口径仍按 NEG_SKIP=1 跑快档）
          NEG_SKIP=1 bash examples/m282_registry_020/verify.sh > /tmp/v_m282.log 2>&1 || { echo "❌ m282 门失败（表⇔磁盘 / 清单双向 / 凭据守卫 / ftp 0.2.0 补覆盖）"; grep -E '^(  FAIL|      |❌)' /tmp/v_m282.log | tail -25; export GHA_ANNOTATION_FAIL=1; exit 1; }
          grep -E '通过 [0-9]+ · 失败' /tmp/v_m282.log | tail -1 || true
          echo "✅ m282_registry_020（表⇔磁盘 244 行 · 清单/登记双向 · 无凭据 · ftp 0.2.0 补覆盖）PASS"

      - name: m283_gate_premise（判据的「第 0 维：前提」—— P1 端口互斥 / P2 强就绪 / P3 禁形 / P4 前提可得）
        if: always()
        run: |
          NEG_SKIP=1 bash examples/m283_gate_premise/verify.sh > /tmp/v_m283.log 2>&1 || { echo "❌ m283 门失败（前提守卫：4 类反例未逐类指名 / 登记过期判据 / 负控）"; grep -E '^(  ❌|== )' /tmp/v_m283.log | tail -25; export GHA_ANNOTATION_FAIL=1; exit 1; }
          grep -E 'M283 门：通过' /tmp/v_m283.log | tail -1 || true
          echo "✅ m283_gate_premise（守卫自证 10/0 · 真仓 rc=0 · 4 类反例逐类指名 · 覆盖边界 4 条）PASS"

      - name: m284_orchestrator（编排骨架入仓 + 判据串「在场」守卫 · 缺陷 490/495）
        if: always()
        run: |
          # ⚠️ M284s1：**去掉 `NEG_SKIP=1`** —— 本门从未实现该开关（传了也只是被忽略），
          #   而它的三道负控不重建 runtime（≈1s）⇒ 让它**全跑**覆盖率更高（不再假装可跳）。
          bash examples/m284_orchestrator/verify.sh > /tmp/v_m284.log 2>&1 || { echo "❌ m284 门失败（编排守卫 O1/O2/O3 未逐条判 / 裁决器六档 / 负控）"; grep -E '^(  ❌|== )' /tmp/v_m284.log | tail -25; export GHA_ANNOTATION_FAIL=1; exit 1; }
          grep -E '汇总：通过' /tmp/v_m284.log | tail -1 || true
          echo "✅ m284_orchestrator（守卫自证 5/0 · 真仓 0 违例 67 个 .sh · 裁决器六档 · 回归 M283 假警报形状 ⇒ GREEN）PASS"

      - name: m285_gate_assertions（门层判据守卫 · 打桩锚点在位 + 判据串在场 · 缺陷 498）
        if: always()
        run: |
          # ⚠️ 本门**不提供** --neg-skip：三道负控改的是 Python 守卫（≈1s，不重建 runtime）⇒ 全跑。
          bash examples/m285_gate_assertions/verify.sh > /tmp/v_m285.log 2>&1 || { echo "❌ m285 门失败（打桩锚点 / 判据串在场 / 判据回放 / 负控）"; grep -E '^(  ❌|== )' /tmp/v_m285.log | tail -25; export GHA_ANNOTATION_FAIL=1; exit 1; }
          grep -E '汇总：通过' /tmp/v_m285.log | tail -1 || true
          echo "✅ m285_gate_assertions（守卫自证 6/0 · 真仓 0 违例 355 个 .sh · 判据回放判红且指名 · 负控 3 道）PASS"

      - name: m128_unlock_grow（扩容分配移出临界区 · 缺陷 439 修好后收编）
        if: always()
        run: |
          bash examples/m128_unlock_grow/verify.sh > /tmp/v_m128.log 2>&1 || { echo "❌ m128_unlock_grow verify 失败"; grep -E '^(  ❌|== )' /tmp/v_m128.log | tail -20; export GHA_ANNOTATION_FAIL=1; exit 1; }
          grep -E '^== M128 门结束' /tmp/v_m128.log || true
          echo "✅ m128_unlock_grow（C1–C12 · 五个站点注入全绿 · C5 对象表扩容已在锁外）PASS"

      - name: devbuild 复用台账（M221 短路在 CI 是否生效 —— 免 403 可读通道）
        # M223（缺陷 325）：**只报「key N 个」无法归因** —— CI 实测「3 个」，而「3 个」
        #   不告诉你**为什么**（⇒ 注解是**第一眼**通道，通道里必须自带证据）。
        #   ⇒ 打印 **key 取值**（按件分组）+ **选料来源**列（rt_key / fallback），
        #     并按 **pxc key** 去重报「源码链漂移数」（vm 的 key 是 `<pxc>/<sha>` 派生，
        #     按字符串去重会虚增 —— 这是 M222 那次「3 个」里至少有 1 个的来源）。
        if: always()
        run: |
          F=/tmp/devbuild_stats.tsv
          if [ ! -f "$F" ]; then
            echo "::notice::devbuild 台账缺失（$F 不存在 —— 本 job 未调用 devbuild？）"
            exit 0
          fi
          B=$(grep -c $'\trebuild\t' "$F" || true); B=${B:-0}
          R=$(grep -c $'\treuse\t'   "$F" || true); R=${R:-0}
          N=$(wc -l < "$F")
          KP=$(awk -F'\t' '$3=="pxc"{print $4}' "$F" | sort -u)
          NKP=$(printf '%s\n' "$KP" | grep -c . || true)
          KVL=$(awk -F'\t' '{print $3"="$4}' "$F" | sort | uniq -c | sort -k2,2 -k1,1nr | awk '{printf "%s×%s ", $2, $1}')
          SRC=$(awk -F'\t' '{print $5}' "$F" | sort | uniq -c | awk '{printf "%s×%s ", $2, $1}')
          echo "::notice::devbuild 台账：调用 ${N} 行 · 重建 ${B} / 复用 ${R} · 源码链 pxc key ${NKP} 个"
          echo "::notice::devbuild 台账 · pxc key 取值：$(printf '%s' "$KP" | tr '\n' ' ')"
          echo "::notice::devbuild 台账 · 逐件：${KVL}"
          echo "::notice::devbuild 台账 · 选料来源：${SRC:-（无第 5 列）}"
          if [ "${NKP:-0}" -gt 1 ]; then
            echo "::warning::devbuild 源码链出现 ${NKP} 个 pxc key ⇒ **指纹漂移**（M223 已加归因：查各门日志的「源码链指纹变化」行）"
          fi
      # M188 补：这一步（工具自测）在 run 382/383 上红了，当时以为读不到 job 日志
      #   ⇒ 注解成了**第一眼**通道。⚠️ M251s1 更正：**日志一直可读**（缺陷 443）——
      #   `python3 selfhost/ci_log.py log <job_id>`；当时看到的 403 是**未带 token** 的调用。
      #   本步把各门的 /tmp/v_*.log 关键行合成**一条** ::error:: 注解（换行编码 %0A）。
      - name: 失败诊断注解（工具自测 —— 第一眼通道；完整日志见 selfhost/ci_log.py）
        # ⚠️⚠️ M216s6：**这一行不能少**。s2 重写本 step 时把它弄丢了 ⇒ 该 step 回退成
        #   默认的 `if: success()` ⇒ 前一步失败时**直接 skip** ⇒ 注解永远不产生
        #   （实测 run 36257633483：step 8 failure、step 9/10/11/12/13 全 skipped）。
        if: failure()
        # ★ M216s2（第 95 轮补 4 · **缺陷 299 家族第四次复发**）：本 step 的逻辑此前内联在此，
        #   而它按「**原始字符数** 3900」裁剪 —— 本仓日志大量中文，`urllib.parse.quote`
        #   会把中文**膨胀 9 倍**（`中` → `%E4%B8%AD`）⇒ 编码后可达 3.5 万，
        #   远超 `::error::` 的 **4096 字符硬上限**（GitHub **workflow command** 的限制，
        #   与 check-run 的 64KB 不是一回事）。实测 run 36248218474：注解长度**恰好 4096**，
        #   从中间截断，**真凶连同最终结论行一起被切掉** ⇒ 白跑一轮。
        #   ⇒ 逻辑抽到 `packaging/ci_diagnose.py`：
        #     ① **按编码长度二分裁剪**（fit()，含后缀预算）；
        #     ② **一条注解只放一件事**（摘要 / 尾 20 行 / 头 20 行 / 可疑门一览）⇒ 互不挤占；
        #     ③ 判据仍是「**最后写入的日志 = 失败门**」（其后门根本没跑）—— 确定性定位；
        #     ④ 自带 `--selftest`：合成 5 场景 + **真实语料 0 误报**判据（本机 100 份实测）。
        #   ⚠️ 末行裁决必须**失败优先**：`══ 通过 165 · 失败 3 ══` 含「通过」⇒ 旧判据判绿。
        run: |
          python3 packaging/ci_diagnose.py --logs '/tmp/v_*.log' --extra '/tmp/m187_gate*' --m187-repro || true
      - name: LSP / MCP 服务器冒烟（--version + 协议入口存在性）
        run: |
          chmod +x bootstrap/pxlsp bootstrap/pxmcp bootstrap/pxcheck
          ./tools/pxc lsp --version
          ./tools/pxc mcp --version
          ./bootstrap/pxcheck --version
          echo "✅ pxlsp / pxmcp / pxcheck 就绪"
      - name: 发布侧守卫自测（Issue 41 单调性守卫 + Issue 56 发布包内容/可复现 + Issue 86 tag 守卫 + M168 安装矩阵与二进制可移植性）
        # ⚠️ 沿用 Issue 64 的教训：**每条独立成行**，不要用 `&&` 串联（`&&` 会吞掉前件失败）。
        # M225s1：本 step 此前**没有诊断包装** —— 首次失败时注解只有
        #   「Process completed with exit code 1」（**指不到真因**）。
        #   按本仓纪律「门的红必须读出真因」改为逐条包装：失败即调
        #   annotate_failure.sh 发一条**富注解**（换行编码 %0A）。
        # M225s2：守卫日志**不能**落 `/tmp/v_*.log` —— 其中一条守卫正是
        #   `ci_diagnose.py --selftest`，而它的判据就扫 `/tmp/v_*.log`
        #   ⇒ 扫描面包含**正在写的自己** ⇒ 判 unknown ⇒ 非 ok ⇒ **必然假红**
        #   （CI 实测：`非 ok 1 份 ['v_ci_diagnose.log']`）。故改用 `guard_*.log`。
        run: |
          set +e
          GUARD_FAIL=""
          run_guard() {
            n="$1"; shift
            echo "── $n"
            "$@" > "/tmp/guard_$n.log" 2>&1
            rc=$?
            tail -5 "/tmp/guard_$n.log"
            if [ "$rc" -ne 0 ]; then
              GUARD_FAIL="$GUARD_FAIL $n(rc=$rc)"
              echo "❌ 发布侧守卫 $n 失败（rc=$rc）"
              bash packaging/annotate_failure.sh "发布侧守卫[$n]" "/tmp/guard_$n.log" 16 14 || true
            fi
            return 0
          }
          run_guard rpm_monotonic bash packaging/selftest_rpm_monotonic_guard.sh
          run_guard make_release  bash packaging/selftest_make_release.sh
          run_guard tag_guard     bash packaging/selftest_tag_guard.sh
          # M248：tag 命名护栏（创建时刻 make_tag.sh + 构建时刻 build_rpm/make_release）
          #   由来：一个 v0.2.0-m245s1 tag 让 gh-pages 出现 puxian-0.2.0-1.m245s1.*.rpm
          #   ⇒ pxrepo_mirror 的 xcheck-rpm-tree 判红 ⇒ 镜像同步停摆（用户报障）。
          run_guard make_tag      bash packaging/selftest_make_tag.sh
          # M238：镜像器判据离线自测（原来从未注册）
          run_guard pxrepo_mirror bash packaging/selftest_pxrepo_mirror.sh
          # M168：install-rpm.sh 的**发行版矩阵离线自测**
          #   （openEuler 22.03/24.03 必须认脸 + 字面目录；不支持组合必须给出替代路线）
          run_guard install_rpm   bash packaging/selftest_install_rpm.sh
          # M216s2：CI 失败诊断器自证（合成场景 + 真实语料 0 误报；
          #   它守的是「CI 红能不能读出真因」——已连续 4 轮被 4096 硬上限卡住）
          run_guard ci_diagnose   python3 packaging/ci_diagnose.py --selftest
          if [ -n "$GUARD_FAIL" ]; then
            echo "::error::发布侧守卫自测失败：$GUARD_FAIL"
            exit 1
          fi
          echo "✅ 发布侧守卫自测全绿（41：旧覆盖新必红 · 56：内容同构 + 位级可复现 · 86：最高里程碑缺 tag 必红 · M168：安装矩阵 42 用例 · 诊断器 10 断言）"
      - name: 二进制可移植性门（M168：入库件必须全静态，与 glibc 版本解耦）
        # 为什么需要（用户报障根因）：官方 aarch64 引导包里的 pxc 曾是**动态件**（需 GLIBC_2.38），
        #   在 openEuler 22.03（glibc 2.34）上「装得上、跑不起来」；同类隐患还有 bootstrap/pxc_vm
        #   （x86_64 动态件，el7 glibc 2.17 上 `px build` 必崩）。而发布链此前**没有任何一步**在
        #   看「这枚二进制到底需要什么」⇒ 本门把它变成可判定的数字。
        run: |
          chmod +x selfhost/check_bin_portability.sh selfhost/check_pkg_arch.sh
          bash selfhost/check_bin_portability.sh --self-test
          bash selfhost/check_bin_portability.sh --arch x86_64 --require-static bootstrap/*
          echo "✅ 入库件 14 件全部：x86_64 + 全静态（零动态库依赖）"
          # M199（缺陷 239）：**发布包架构卫生门**自证 —— 包内不得夹带异架构/跨平台**构建输入**
          #   （fixture 取自仓库：x86-64 .o / aarch64 .o / COFF .o / 两架构 .a ⇒ 判据与环境无关）
          bash selfhost/check_pkg_arch.sh --self-test
      - name: M67 x86_64 native 档（m67_multiarch：hello/http/sqlite + gc_stress/gc_single GC 压力）
        run: |
          bash examples/m67_multiarch/verify.sh --arch x86_64 >/dev/null
          echo "✅ M67 x86_64 档（含 gc_stress 并发 4 worker + gc_single 3 万迭代 GC 压力）PASS"

  multiarch-cross:
    name: 多架构交叉编译 + qemu 验证（${{ matrix.arch }}，M67）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armv7, riscv64]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 qemu-user-static
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static
          qemu-aarch64-static --version | head -1

      - name: 映射交叉工具链（arch → musl.cc tarball URL / 解压目录 / zig target）
        id: musl-map
        run: |
          case "${{ matrix.arch }}" in
            aarch64) URL=https://musl.cc/aarch64-linux-musl-cross.tgz;       DIR=aarch64-linux-musl-cross;      ZT=aarch64-linux-musl;      PRE=aarch64-linux-musl ;;
            armv7)   URL=https://musl.cc/armv7l-linux-musleabihf-cross.tgz;  DIR=armv7l-linux-musleabihf-cross; ZT=arm-linux-musleabihf;    PRE=armv7l-linux-musleabihf ;;
            riscv64) URL=https://musl.cc/riscv64-linux-musl-cross.tgz;       DIR=riscv64-linux-musl-cross;      ZT=riscv64-linux-musl;      PRE=riscv64-linux-musl ;;
          esac
          echo "URL=$URL" >> "$GITHUB_OUTPUT"
          echo "DIR=$DIR" >> "$GITHUB_OUTPUT"
          echo "ZT=$ZT" >> "$GITHUB_OUTPUT"
          echo "PRE=$PRE" >> "$GITHUB_OUTPUT"

      - name: 缓存交叉工具链目录（musl.cc 解压 / zig wrapper 同布局）
        id: cache-musl
        uses: actions/cache@v4
        with:
          path: /opt/muslcc/${{ steps.musl-map.outputs.DIR }}
          key: muslcc-${{ matrix.arch }}-v1

      - name: 缓存 zig cc（路 2 fallback，55MB 覆盖三架构 musl 交叉）
        id: cache-zig
        uses: actions/cache@v4
        with:
          path: /opt/zig
          key: zig-x86_64-linux-0.16.0-v1

      - name: 下载交叉工具链（路1 musl.cc 快速失败 → 路2 zig cc fallback）
        id: dl
        if: steps.cache-musl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/muslcc /opt/zig && sudo chown "$USER" /opt/muslcc /opt/zig
          URL="${{ steps.musl-map.outputs.URL }}"
          DIR="${{ steps.musl-map.outputs.DIR }}"
          ZT="${{ steps.musl-map.outputs.ZT }}"
          PRE="${{ steps.musl-map.outputs.PRE }}"
          ok=0
          # ---- 路 1：musl.cc tarball（2 次快速尝试，不通即弃保 CI 时效）----
          for i in 1 2; do
            echo "── [路1 musl.cc] 尝试 $i/2: $URL"
            if curl -4 -fL -A "Mozilla/5.0 (X11; Linux x86_64) puxian-ci" \
                --retry 1 --connect-timeout 12 --max-time 240 \
                -o /tmp/cc.tgz "$URL" 2>/tmp/cc.err \
                && [ -s /tmp/cc.tgz ] \
                && tar tzf /tmp/cc.tgz >/dev/null 2>&1; then
              echo "✅ 路1 musl.cc 下载成功（$(du -h /tmp/cc.tgz | cut -f1)）"
              tar xzf /tmp/cc.tgz -C /opt/muslcc
              echo "TOOLCHAIN=muslcc" >> "$GITHUB_OUTPUT"
              ok=1
              break
            fi
            echo "  ⚠️ 路1 失败：$(head -c 300 /tmp/cc.err 2>/dev/null | tr '\n' ' ')"
            rm -f /tmp/cc.tgz
            sleep 3
          done
          [ "$ok" = 1 ] && exit 0
          # ---- 路 2：zig cc fallback（ziglang.org；zig 单文件 = 三架构 musl 交叉 clang）----
          echo "── [路2 zig] musl.cc runner 侧不可达，切换 zig cc"
          if [ ! -x /opt/zig/zig ]; then
            curl -4 -fL -A "Mozilla/5.0 puxian-ci" --retry 3 --retry-all-errors \
                --connect-timeout 15 --max-time 600 \
                -o /tmp/zig.tar.xz \
                "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
            tar xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
            rm -f /tmp/zig.tar.xz
          fi
          /opt/zig/zig version
          # 生成 <triple>-gcc/ar/ranlib wrapper 到 /opt/muslcc/$DIR/bin（对齐 musl.cc 布局，后续 PATH 复用零改动）
          BIN="/opt/muslcc/$DIR/bin"
          mkdir -p "$BIN"
          printf '#!/bin/sh\nexec /opt/zig/zig cc -target %s "$@"\n' "$ZT" > "$BIN/$PRE-gcc"
          printf '#!/bin/sh\nexec /opt/zig/zig ar "$@"\n'            > "$BIN/$PRE-ar"
          printf '#!/bin/sh\nexec /opt/zig/zig ranlib "$@"\n'        > "$BIN/$PRE-ranlib"
          chmod +x "$BIN/$PRE-gcc" "$BIN/$PRE-ar" "$BIN/$PRE-ranlib"
          echo "✅ 路2 zig wrapper 就绪：$BIN（$PRE-gcc → zig cc -target $ZT）"
          echo "TOOLCHAIN=zig" >> "$GITHUB_OUTPUT"

      - name: 交叉工具链就绪
        run: /opt/muslcc/${{ steps.musl-map.outputs.DIR }}/bin/*-gcc --version | head -1

      - name: 缓存现编交叉静态库（armv7/riscv64；aarch64 仓库预置免编）
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: /opt/px-multiarch
          key: px-libs-${{ matrix.arch }}-v2

      - name: 现编 armv7/riscv64 交叉库（缓存未命中）
        if: steps.cache-libs.outputs.cache-hit != 'true' && matrix.arch != 'aarch64'
        run: |
          export PATH=/opt/muslcc/${{ steps.musl-map.outputs.DIR }}/bin:$PATH
          mkdir -p /opt/px-multiarch
          tools/cross_multiarch.sh --arch ${{ matrix.arch }} --outdir /opt/px-multiarch/${{ matrix.arch }}

      - name: 交叉编译 + qemu 验证（${{ matrix.arch }}）
        run: |
          set -o pipefail
          export PATH=/opt/muslcc/${{ steps.musl-map.outputs.DIR }}/bin:$PATH
          # M168：失败诊断走 ::error:: 注解（本仓 job 日志非管理员不可读）
          #   —— 2026-09-21 本步首红时**读不到原因**，只能靠"改一处再跑一次"试错。
          run_all() {
            if [ "${{ matrix.arch }}" = "aarch64" ]; then
              bash examples/m67_aarch64/verify.sh          # 阶段一三用例（aarch64 一等支持）
            fi
            bash examples/m67_multiarch/verify.sh --arch ${{ matrix.arch }}
          }
          if ! run_all 2>&1 | tee "$RUNNER_TEMP/m67.log"; then
            bash packaging/annotate_failure.sh "m67-${{ matrix.arch }}" "$RUNNER_TEMP/m67.log"
            exit 1
          fi

      - name: M159 交叉自举档（x86_64 → aarch64 · musl 静态 · 只对 aarch64 档做）
        if: matrix.arch == 'aarch64'
        run: |
          set -o pipefail
          export PATH=/opt/muslcc/${{ steps.musl-map.outputs.DIR }}/bin:$PATH
          echo "── 工具链：$(command -v aarch64-linux-musl-gcc || echo '(PATH 上找不到)')"
          aarch64-linux-musl-gcc --version | head -1 || true
          if ! ./selfhost/native_bootstrap.sh --target-arch aarch64 --outdir /tmp/nb-a64 2>&1 | tee /tmp/nb-a64.log; then
            tail -30 /tmp/nb-a64.log | sed 's/^/::error::nb-a64 › /'
            exit 1
          fi
          grep -q "NATIVE-BOOTSTRAP-OK" /tmp/nb-a64.log || { tail -20 /tmp/nb-a64.log | sed 's/^/::error::nb-a64 › /'; exit 1; }
          file /tmp/nb-a64/pxc
          # 架构与静态性断言用 readelf（比 grep file 文案稳）
          readelf -h /tmp/nb-a64/pxc | grep -q "AArch64" || { echo "::error::产物不是 aarch64"; readelf -h /tmp/nb-a64/pxc | sed 's/^/::error::readelf › /'; exit 1; }
          if readelf -d /tmp/nb-a64/pxc 2>/dev/null | grep -q "NEEDED"; then
            echo "::error::产物是动态链接（含 DT_NEEDED）"; readelf -d /tmp/nb-a64/pxc | sed 's/^/::error::readelf-d › /'; exit 1
          fi
          echo "── qemu 下真跑自举件（第三方报告 R1002 的现场就在这一步）"
          qemu-aarch64-static /tmp/nb-a64/pxc --version || { echo "::error::qemu 下 --version 失败"; exit 1; }
          mkdir -p /tmp/nb-a64/s && printf 'print("a64-boot-ok")\n' > /tmp/nb-a64/s/h.px
          if ! qemu-aarch64-static /tmp/nb-a64/pxc build /tmp/nb-a64/s/h.px > /tmp/nb-a64/s/h.c 2>/tmp/nb-a64/s/h.err; then
            tail -20 /tmp/nb-a64/s/h.err | sed 's/^/::error::qemu-pxc › /'; exit 1
          fi
          grep -q "a64-boot-ok" /tmp/nb-a64/s/h.c || { echo "::error::生成的 C 缺字面量"; head -5 /tmp/nb-a64/s/h.c | sed 's/^/::error::h.c › /'; exit 1; }
          wc -l /tmp/nb-a64/s/h.c
          echo "✅ M159 交叉自举档：aarch64 静态自举件可用（qemu 实测）"

      - name: cross_multiarch.sh / cross_aarch64.sh 冒烟（存在性 + 语法）
        run: |
          [ -f tools/cross_multiarch.sh ] || { echo "❌ 缺 tools/cross_multiarch.sh"; exit 1; }
          [ -f tools/cross_aarch64.sh ] || { echo "❌ 缺 tools/cross_aarch64.sh"; exit 1; }
          bash -n tools/cross_multiarch.sh
          bash -n tools/cross_aarch64.sh
          echo "✅ cross_multiarch.sh / cross_aarch64.sh 存在且语法 OK（发布包已含）"

  # ============================================================
  # M159（R45 · 缺口 G4）：**原生 aarch64 自举自证** —— 全仓此前只在 x86_64 上自举，
  #   aarch64 档只做"交叉编译 + qemu 跑用例"（examples/m67_aarch64），**从不**问
  #   「在 aarch64 上从源码自举能不能成」。第三方仓库 px-openEuler-bootstrap 正是填这条缝
  #   （并报告了 gcc11-aarch64 上 pxc0 编译 compiler.px 报 R1002 索引 null）。
  #   本 job 把这条链变成官方能力（只用 runner 自带 gcc）：
  #     ① selfhost/native_bootstrap.sh：编 runtime → 用基准 golden/compiler.c 编原生 pxc0
  #        → **自证**（pxc0 编 compiler.px 与基准逐字节一致）——R1002 若存在，必在此步红；
  #     ② 把现编原生 pxc 装成工具链，验证**裸 `px build` 在 aarch64 上零参数可用**
  #        （M159 宿主机架构自适应：自动 lib-aarch64 + 自动 --no-quic）；
  #     ③ 跑 m159_hostarch 门（宿主架构决策）。
  #   GitHub 公开仓库可用 arm64 runner（ubuntu-24.04-arm），故这条覆盖不再需要自备机器。
  # ============================================================
  native-arm64:
    name: 原生 aarch64 自举自证 + 裸 build（gcc-only，M159）
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境自述（宿主架构 / gcc / libc —— R1002 现场取证用）
        run: |
          uname -m; uname -sr
          gcc --version | head -1
          ldd --version | head -1
          ls -la bootstrap/ | head -20

      - name: 原生自举（gcc-only · **--portable**：M168 起默认产物必须全静态）—— 含自证：pxc0 编 compiler.px ↔ golden/compiler.c
        run: |
          set -o pipefail
          # M168：本 job 与发布侧 aarch64 job 同口径（--portable）—— 发布链的"包内必须
          #   与 glibc 版本解耦"这件事，在 main 上就要有人守；否则只能等 tag 才发现。
          if ! bash selfhost/native_bootstrap.sh --portable --outdir "$RUNNER_TEMP/nb" 2>&1 | tee "$RUNNER_TEMP/nb.log"; then
            tail -30 "$RUNNER_TEMP/nb.log" | sed 's/^/::error::nb /'; exit 1
          fi
          grep -q "static=1" "$RUNNER_TEMP/nb.log" || { echo "::error::原生自举件不是全静态"; grep NATIVE-BOOTSTRAP "$RUNNER_TEMP/nb.log" | sed 's/^/::error::nb /'; exit 1; }
          test -x "$RUNNER_TEMP/nb/pxc" || { echo "::error::缺 $RUNNER_TEMP/nb/pxc"; ls -l "$RUNNER_TEMP/nb" | sed 's/^/::error::ls /'; exit 1; }
          grep -q "NATIVE-BOOTSTRAP-OK" "$RUNNER_TEMP/nb.log" || { tail -20 "$RUNNER_TEMP/nb.log" | sed 's/^/::error::nb /'; exit 1; }

      - name: 现编其余原生工具（pxi / pxl / pxpar）并装成工具链（仅本 run 生效，不入库）
        # 口径：`bootstrap/pxc build <f>` 只把 C 写到 stdout，链接/runtime 缓存由 tools/px 负责
        #   ⇒ 先把**原生 pxc** 顶上 bootstrap/pxc，再用 tools/px 的 **C 轨**（--c）现编其余件。
        #   VM 轨（用户面默认）需要入库 pxc_vm（x86_64），本 job 不用它，故全程 PX_BUILD_ENGINE=c。
        # M201：**件清单与 flag 只有一处**（`selfhost/build_native_tools.sh`）—— 原先本 job 与
        #   release.yml 各写一遍 12 件循环，而漂移的代价已实测（解释器件被自动裁剪 ⇒ 缺陷 241）。
        run: |
          set -e
          cp -f "$RUNNER_TEMP/nb/pxc" bootstrap/pxc
          if ! bash selfhost/build_native_tools.sh --dir bootstrap --no-check 2>&1 | tee "$RUNNER_TEMP/bnt.log"; then
            echo "::error::原生工具现编失败"; grep -E '❌' "$RUNNER_TEMP/bnt.log" | sed 's/^/::error::bnt /'; exit 1
          fi
          file bootstrap/pxc bootstrap/pxi bootstrap/pxl bootstrap/pxpar | sed 's/^/   /'

      - name: 裸 px build / px run 冒烟（**零参数**，靠 M159 宿主架构自适应）
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          printf 'print("native-aarch64-ok")\n' > hello.px
          # 仓库根有 .px_modules / stdlib 依赖 → 用仓库内的 tools/px（PX_STDLIB 自发现）
          cd "$GITHUB_WORKSPACE"
          echo "── 计划（应自动 lib-aarch64 + no_quic=1 + **engine 自动落 C 轨**）"
          if ! tools/px build --print-plan "$RUNNER_TEMP/smoke/hello.px" > /tmp/plan.txt 2>&1; then
            sed 's/^/::error::plan /' /tmp/plan.txt; exit 1
          fi
          cat /tmp/plan.txt
          grep -q "^plan: engine=c" /tmp/plan.txt || { echo "::error::计划未自动落 C 轨（aarch64 上 VM 轨不可用）"; sed 's/^/::error::plan /' /tmp/plan.txt; exit 1; }
          grep -q "^plan: no_quic=1" /tmp/plan.txt || { echo "::error::计划未自动裁 QUIC"; sed 's/^/::error::plan /' /tmp/plan.txt; exit 1; }
          echo "── 裸 build（零参数：自动 C 轨 + lib-aarch64 + no-quic）"
          if ! tools/px build "$RUNNER_TEMP/smoke/hello.px" > /tmp/build.log 2>&1; then
            tail -25 /tmp/build.log | sed 's/^/::error::build /'; exit 1
          fi
          tail -3 /tmp/build.log
          out="$RUNNER_TEMP/smoke/build/hello"
          test -x "$out" || { echo "::error::缺产物 $out"; ls -lR "$RUNNER_TEMP/smoke" | sed 's/^/::error::ls /'; exit 1; }
          file "$out"
          ldd "$out" 2>&1 | head -3 || true
          got="$("$out")"
          test "$got" = "native-aarch64-ok" || { echo "::error::产物运行输出异常: [$got]"; exit 1; }
          echo "── 解释轨（pxi 原生）"
          if ! tools/px run "$RUNNER_TEMP/smoke/hello.px" > /tmp/run.log 2>&1; then
            tail -20 /tmp/run.log | sed 's/^/::error::run /'; exit 1
          fi
          cat /tmp/run.log
          grep -q aarch64-ok /tmp/run.log || { tail -20 /tmp/run.log | sed 's/^/::error::run /'; exit 1; }
          echo "✅ 原生 aarch64：零参数 build + run 全通"
      - name: M168 发布侧口径门（12 件原生工具 + 二进制可移植性门 + M201 解释器能力面门）
        # 为什么在这里（而不是只在发布 job）：**发布 job 的日志外部不可读**（API 403），
        #   而 main 上的 CI 注解可读 ⇒ 「包内必须全静态 + 本架构」这条口径在 main 上守，
        #   失败信息走 ::error:: 注解，一眼可定位。
        # M201：件清单/flag 已收敛到 `selfhost/build_native_tools.sh`（上一步已装好），
        #   本步**只做判据**，不重复构建。
        run: |
          set -e
          if ! bash selfhost/check_bin_portability.sh --self-test > "$RUNNER_TEMP/pst.log" 2>&1; then
            echo "::error::可移植性门自证失败"; sed 's/^/::error::pst /' "$RUNNER_TEMP/pst.log"; exit 1
          fi
          if ! bash selfhost/check_bin_portability.sh --arch aarch64 --require-static bootstrap/* > "$RUNNER_TEMP/pg.log" 2>&1; then
            echo "::error::可移植性门判红（有件不是 aarch64 全静态）"; sed 's/^/::error::portability /' "$RUNNER_TEMP/pg.log"; exit 1
          fi
          cat "$RUNNER_TEMP/pg.log"
          echo "── M201 解释器能力面门（PX-DEF-035：解释器件必须全能力）"
          if ! bash examples/m201_interp_ffi/verify.sh --interp "$PWD/bootstrap/pxi" > "$RUNNER_TEMP/ffi.log" 2>&1; then
            echo "::error::解释器能力面门判红（族缺失 ⇒ 官方库在解释轨不可用）"
            sed 's/^/::error::ffi /' "$RUNNER_TEMP/ffi.log"; exit 1
          fi
          tail -8 "$RUNNER_TEMP/ffi.log"
          echo "✅ 12 件原生工具 + bootstrap/pxc 全部：aarch64 + 全静态 · 解释器能力面全"

      - name: 宿主机架构自适应门（m159_hostarch）
        env:
          PX_BUILD_ENGINE: c
        run: |
          set -o pipefail
          if ! bash examples/m159_hostarch/verify.sh 2>&1 | tee /tmp/gate.log; then
            grep -E "❌|FAIL|失败" /tmp/gate.log | sed 's/^/::error::gate /'
            tail -30 /tmp/gate.log | sed 's/^/::error::gate /'
            exit 1
          fi

      - name: 交叉档冒烟（确认 aarch64 原生宿主上交叉档仍可用）
        run: |
          bash -n tools/cross_aarch64.sh
          bash -n tools/cross_multiarch.sh
          echo "✅ 交叉脚本语法 OK（详细交叉档由 multiarch-cross job 在 x86_64 上跑）"

      - name: 失败时留现场（自举日志）
        if: failure()
        run: |
          echo "──── native_bootstrap 日志尾部 ────"
          tail -60 "$RUNNER_TEMP/nb.log" 2>/dev/null || true
          echo "──── pxc0 自证 stderr ────"
          tail -40 "$RUNNER_TEMP/nb/B.err" 2>/dev/null || true
