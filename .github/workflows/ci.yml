          grep -E 'M278 门结果' /tmp/v_m278.log | tail -1 || true
          echo "✅ m278_release_reconcile（离线自证 30/0 · 双向精确相等 · 豁免过期判据 · 负控 STALE-IGNORE 判红）PASS"

      - name: m279_std_surface（stdlib 边界/错类型 + 结构性死循环）
        run: |
          set -o pipefail
