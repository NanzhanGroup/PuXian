name: PuXian CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    name: 自举回归（PuXian-only）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查引导二进制
        run: |
          chmod +x bootstrap/pxc bootstrap/pxi bootstrap/pxl bootstrap/pxpar
          ./bootstrap/pxc --version 2>/dev/null || ./bootstrap/pxc build examples/hello.px >/dev/null
          echo "✅ 引导二进制就绪"

      - name: 工具链冒烟（build + run）
        run: |
          ./tools/pxc build examples/hello.px | tail -1
          ./examples/build/hello | head -1
          ./tools/pxc run examples/hello.px | head -1
          ./tools/pxc lex examples/hello.px | head -3
          ./tools/pxc parse examples/hello.px | head -3

      - name: 对拍回归 — 词法（--lexer）
        run: ./selfhost/diffcheck.sh --lexer 2>&1 | tail -3

      - name: 对拍回归 — 语法（--parser）
        run: ./selfhost/diffcheck.sh --parser 2>&1 | tail -3

      - name: 对拍回归 — 错误场景（--errors）
        run: ./selfhost/diffcheck.sh --errors 2>&1 | tail -3

      - name: 对拍回归 — codegen（--codegen）
        run: ./selfhost/diffcheck.sh --codegen 2>&1 | tail -5

      - name: 对拍回归 — 值系统（--value）
        run: ./selfhost/diffcheck.sh --value 2>&1 | tail -3

      - name: 对拍回归 — 解释器（--interp）
        run: ./selfhost/diffcheck.sh --interp 2>&1 | tail -3

      - name: 自举证明（pxc 编译 compiler.px 与基准一致）
        run: |
          cd selfhost
          ./bootstrap_prove.sh 2>&1 | tail -6

  examples:
    name: 示例编译运行
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 编译并运行关键示例
        run: |
          chmod +x bootstrap/pxc bootstrap/pxi tools/pxc
          for ex in examples/fib.px examples/match.px examples/struct.px; do
            [ -f "$ex" ] || continue
            echo "── $ex"
            ./tools/pxc build "$ex" 2>&1 | tail -1
          done
          ./examples/build/fib | head -3

  toolchain:
    name: 工具链自举质量门（fmt + lint）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: fmt --check（selfhost + tools + stdlib 收敛域）
        run: |
          chmod +x bootstrap/pxfmt bootstrap/pxlint bootstrap/pxc
          set -e
          for f in selfhost/*.px tools/*.px stdlib/*.px; do
            ./bootstrap/pxfmt --check "$f" >/dev/null || { echo "❌ 格式不符: $f"; exit 1; }
          done
          echo "✅ fmt --check 全绿（selfhost+tools+stdlib）"
      - name: lint（compiler 主入口 + 独立工具文件）
        run: |
          chmod +x bootstrap/pxlint
          ./bootstrap/pxlint selfhost/compiler.px >/dev/null || { echo "❌ compiler.px 项目级 lint 失败"; exit 1; }
          for f in tools/fmt_core.px tools/fmtlexer.px tools/jsonrpc_core.px tools/lint_core.px tools/lsp_core.px tools/pxbench.px tools/pxcheck.px tools/pxdoc.px tools/pxfmt.px tools/pxlint.px tools/pxlsp.px tools/pxmcp.px tools/pxpkg.px tools/pxslice.px tools/pxtest.px tools/routegen.px; do
            ./bootstrap/pxlint "$f" >/dev/null || { echo "❌ lint 失败: $f"; exit 1; }
          done
          echo "✅ lint 全绿（compiler 主入口 0 错 + tools 16 文件 0/0）"
      - name: 生态索引防漂移（stdlib → ecosystem_index.json + native_index.json + ECOSYSTEM/CHEATSHEET 同步）
        run: |
          chmod +x bootstrap/pxi
          ./bootstrap/pxi tools/gen_ecosystem.px
          bash tools/gen_native_table.sh
          git diff --exit-code -- docs/ecosystem_index.json docs/native_index.json || { echo "❌ stdlib/runtime 变更未同步生态/native 索引 → 重跑生成器并同步 docs/ECOSYSTEM.md 与 docs/PUXIAN_CHEATSHEET.md"; exit 1; }
          echo "✅ 生态索引与 stdlib 一致 + native 清单与 runtime 一致"
      - name: 工具自测（m64_fmt / m64_lint / m65_lsp / m65_mcp + m66_yaml/pxml/lunar + m71_mcp_build + m82_http_serve_unix）
        run: |
          bash examples/m64_fmt/verify.sh >/dev/null && bash examples/m64_lint/verify.sh >/dev/null
          python3 -c "import sys; assert sys.version_info[0]==3" && bash examples/m65_lsp/verify.sh >/dev/null && bash examples/m65_mcp/verify.sh >/dev/null
          bash examples/m66_yaml/verify.sh >/dev/null && bash examples/m66_pxml/verify.sh >/dev/null && bash examples/m66_lunar/verify.sh >/dev/null
          bash examples/m71_mcp_build/verify.sh >/dev/null && bash examples/m82_http_serve_unix/verify.sh >/dev/null
          echo "✅ m64_fmt / m64_lint / m65_lsp / m65_mcp / m66_yaml / m66_pxml / m66_lunar / m71_mcp_build / m82_http_serve_unix verify 全 PASS"
      - name: LSP / MCP 服务器冒烟（--version + 协议入口存在性）
        run: |
          chmod +x bootstrap/pxlsp bootstrap/pxmcp bootstrap/pxcheck
          ./tools/pxc lsp --version && ./tools/pxc mcp --version && ./bootstrap/pxcheck --version
          echo "✅ pxlsp / pxmcp / pxcheck 就绪"
      - name: M67 x86_64 native 档（m67_multiarch：hello/http/sqlite + gc_stress/gc_single GC 压力）
        run: |
          bash examples/m67_multiarch/verify.sh --arch x86_64 >/dev/null
          echo "✅ M67 x86_64 档（含 gc_stress 并发 4 worker + gc_single 3 万迭代 GC 压力）PASS"

  multiarch-cross:
    name: 多架构交叉编译 + qemu 验证（${{ matrix.arch }}，M67）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armv7, riscv64]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 qemu-user-static
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static
          qemu-aarch64-static --version | head -1

      - name: 映射交叉工具链（arch → musl.cc tarball URL / 解压目录 / zig target）
        id: musl-map
        run: |
          case "${{ matrix.arch }}" in
            aarch64) URL=https://musl.cc/aarch64-linux-musl-cross.tgz;       DIR=aarch64-linux-musl-cross;      ZT=aarch64-linux-musl;      PRE=aarch64-linux-musl ;;
            armv7)   URL=https://musl.cc/armv7l-linux-musleabihf-cross.tgz;  DIR=armv7l-linux-musleabihf-cross; ZT=arm-linux-musleabihf;    PRE=armv7l-linux-musleabihf ;;
            riscv64) URL=https://musl.cc/riscv64-linux-musl-cross.tgz;       DIR=riscv64-linux-musl-cross;      ZT=riscv64-linux-musl;      PRE=riscv64-linux-musl ;;
          esac
          echo "URL=$URL" >> "$GITHUB_OUTPUT"
          echo "DIR=$DIR" >> "$GITHUB_OUTPUT"
          echo "ZT=$ZT" >> "$GITHUB_OUTPUT"
          echo "PRE=$PRE" >> "$GITHUB_OUTPUT"

      - name: 缓存交叉工具链目录（musl.cc 解压 / zig wrapper 同布局）
        id: cache-musl
        uses: actions/cache@v4
        with:
          path: /opt/muslcc/${{ steps.musl-map.outputs.DIR }}
          key: muslcc-${{ matrix.arch }}-v1

      - name: 缓存 zig cc（路 2 fallback，55MB 覆盖三架构 musl 交叉）
        id: cache-zig
        uses: actions/cache@v4
        with:
          path: /opt/zig
          key: zig-x86_64-linux-0.16.0-v1

      - name: 下载交叉工具链（路1 musl.cc 快速失败 → 路2 zig cc fallback）
        id: dl
        if: steps.cache-musl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/muslcc /opt/zig && sudo chown "$USER" /opt/muslcc /opt/zig
          URL="${{ steps.musl-map.outputs.URL }}"
          DIR="${{ steps.musl-map.outputs.DIR }}"
          ZT="${{ steps.musl-map.outputs.ZT }}"
          PRE="${{ steps.musl-map.outputs.PRE }}"
          ok=0
          # ---- 路 1：musl.cc tarball（2 次快速尝试，不通即弃保 CI 时效）----
          for i in 1 2; do
            echo "── [路1 musl.cc] 尝试 $i/2: $URL"
            if curl -4 -fL -A "Mozilla/5.0 (X11; Linux x86_64) puxian-ci" \
                --retry 1 --connect-timeout 12 --max-time 240 \
                -o /tmp/cc.tgz "$URL" 2>/tmp/cc.err \
                && [ -s /tmp/cc.tgz ] \
                && tar tzf /tmp/cc.tgz >/dev/null 2>&1; then
              echo "✅ 路1 musl.cc 下载成功（$(du -h /tmp/cc.tgz | cut -f1)）"
              tar xzf /tmp/cc.tgz -C /opt/muslcc
              echo "TOOLCHAIN=muslcc" >> "$GITHUB_OUTPUT"
              ok=1
              break
            fi
            echo "  ⚠️ 路1 失败：$(head -c 300 /tmp/cc.err 2>/dev/null | tr '\n' ' ')"
            rm -f /tmp/cc.tgz
            sleep 3
          done
          [ "$ok" = 1 ] && exit 0
          # ---- 路 2：zig cc fallback（ziglang.org；zig 单文件 = 三架构 musl 交叉 clang）----
          echo "── [路2 zig] musl.cc runner 侧不可达，切换 zig cc"
          if [ ! -x /opt/zig/zig ]; then
            curl -4 -fL -A "Mozilla/5.0 puxian-ci" --retry 3 --retry-all-errors \
                --connect-timeout 15 --max-time 600 \
                -o /tmp/zig.tar.xz \
                "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
            tar xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
            rm -f /tmp/zig.tar.xz
          fi
          /opt/zig/zig version
          # 生成 <triple>-gcc/ar/ranlib wrapper 到 /opt/muslcc/$DIR/bin（对齐 musl.cc 布局，后续 PATH 复用零改动）
          BIN="/opt/muslcc/$DIR/bin"
          mkdir -p "$BIN"
          printf '#!/bin/sh\nexec /opt/zig/zig cc -target %s "$@"\n' "$ZT" > "$BIN/$PRE-gcc"
          printf '#!/bin/sh\nexec /opt/zig/zig ar "$@"\n'            > "$BIN/$PRE-ar"
          printf '#!/bin/sh\nexec /opt/zig/zig ranlib "$@"\n'        > "$BIN/$PRE-ranlib"
          chmod +x "$BIN/$PRE-gcc" "$BIN/$PRE-ar" "$BIN/$PRE-ranlib"
          echo "✅ 路2 zig wrapper 就绪：$BIN（$PRE-gcc → zig cc -target $ZT）"
          echo "TOOLCHAIN=zig" >> "$GITHUB_OUTPUT"

      - name: 交叉工具链就绪
        run: /opt/muslcc/${{ steps.musl-map.outputs.DIR }}/bin/*-gcc --version | head -1

      - name: 缓存现编交叉静态库（armv7/riscv64；aarch64 仓库预置免编）
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: /opt/px-multiarch
          key: px-libs-${{ matrix.arch }}-v2

      - name: 现编 armv7/riscv64 交叉库（缓存未命中）
        if: steps.cache-libs.outputs.cache-hit != 'true' && matrix.arch != 'aarch64'
        run: |
          export PATH=/opt/muslcc/${{ steps.musl-map.outputs.DIR }}/bin:$PATH
          mkdir -p /opt/px-multiarch
          tools/cross_multiarch.sh --arch ${{ matrix.arch }} --outdir /opt/px-multiarch/${{ matrix.arch }}

      - name: 交叉编译 + qemu 验证（${{ matrix.arch }}）
        run: |
          export PATH=/opt/muslcc/${{ steps.musl-map.outputs.DIR }}/bin:$PATH
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            bash examples/m67_aarch64/verify.sh          # 阶段一三用例（aarch64 一等支持）
          fi
          bash examples/m67_multiarch/verify.sh --arch ${{ matrix.arch }}

      - name: cross_multiarch.sh / cross_aarch64.sh 冒烟（存在性 + 语法）
        run: |
          [ -f tools/cross_multiarch.sh ] || { echo "❌ 缺 tools/cross_multiarch.sh"; exit 1; }
          [ -f tools/cross_aarch64.sh ] || { echo "❌ 缺 tools/cross_aarch64.sh"; exit 1; }
          bash -n tools/cross_multiarch.sh && bash -n tools/cross_aarch64.sh
          echo "✅ cross_multiarch.sh / cross_aarch64.sh 存在且语法 OK（发布包已含）"
