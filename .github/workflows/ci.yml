name: PuXian CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    name: 自举回归（PuXian-only）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查引导二进制
        run: |
          chmod +x bootstrap/pxc bootstrap/pxi bootstrap/pxl bootstrap/pxpar
          ./bootstrap/pxc --version 2>/dev/null || ./bootstrap/pxc build examples/hello.px >/dev/null
          echo "✅ 引导二进制就绪"

      - name: 工具链冒烟（build + run）
        run: |
          ./tools/pxc build examples/hello.px | tail -1
          ./examples/build/hello | head -1
          ./tools/pxc run examples/hello.px | head -1
          ./tools/pxc lex examples/hello.px | head -3
          ./tools/pxc parse examples/hello.px | head -3

      # ============================================================
      # M113-S1（Issue 58）：**入库编译器重烘门**
      #   改 selfhost/*.px 却忘了重烘 bootstrap/pxc，是结构性失明 ——
      #   bootstrap_prove 的 golden 由同一枚 pxc 重定基，老件+自己的 golden 永远自洽
      #   ⇒ 门绿 ≠ 用户拿到修复（实测旧件落后 M104-M111：编 compiler.px 慢 50×）。
      #   本步断言「入库件 == 当前源码现编产物」的行为一致（不一致即红，提示重烘）。
      #   成本：新检出 ≈17s（含 8s 冒烟缓存）；stale 件会拖到数分钟（正是要逼出来的信号）。
      # ============================================================
      - name: 入库编译器重烘门 — 入库件 vs 现编件（Issue 58）
        run: |
          set -o pipefail
          ./selfhost/rebake_bin.sh --check 2>&1 | tail -6

      # ============================================================
      # M113-S2（Issue 58 续）：**VM 轨（用户面默认轨）重烘门**
      #   S1 只给 C 轨上了门，而用户跑的是 tools/px → bootstrap/pxc_vm：
      #   入库 pxc_vm 漏烘时，只有当小事例行为刚好不同才会露（Issue 46 实况）。
      #   本步两判据：① 内嵌「源码链指纹」== 当前源码（O(1)，重烘时链入）；
      #   ② 两轨字节码镜像逐字节一致（`bc compiler.px`，实测 ≈90s：C 53s / VM 36s）。
      #   VM 轨的**逐例行为**由下面的 engine_parity 门守（判据不重复）。
      # ============================================================
      - name: VM 轨重烘门 — 入库 pxc_vm 来源 + 字节码镜像（Issue 58）
        run: |
          set -o pipefail
          ./selfhost/rebake_bin.sh --check-vm 2>&1 | tail -8

      # ============================================================
      # M114-S2（Issue 55）：**全件源码链门** —— 入库件有 14 个，Issue 58 只治了 2 个。
      #   --check-all 逐件读回内嵌指纹，与该件入口源的 **import 闭包**（递归到不动点）
      #   现算指纹比对：O(1)、秒级。未全件重烘时的实测 = 12/14 件无指纹（来源不可判定）。
      #   本步与上面两道门的判据不重叠：上面两门管 pxc/pxc_vm 的**行为**，本门管**全部件的来源**。
      # ============================================================
      - name: 全件源码链门 — bootstrap/ 14 件来源可判定（Issue 55）
        run: |
          set -o pipefail
          ./selfhost/rebake_bin.sh --check-all 2>&1 | tail -18

      # ============================================================
      # M113-S1（Issue 58 续）：**门的退出码必须能传到 CI**
      #   此前每个门都写成 `... 2>&1 | tail -N` —— 管道退出码取自 tail（恒 0），
      #   且 diffcheck 的 --lexer/--parser/--codegen 分支本身也恒 `exit 0`
      #   ⇒ 「门红」在 CI 里永远是绿（门结构性失明的另一半，与入库件未重烘同源）。
      #   现两头都堵：diffcheck 判退出码 + 此处 `set -o pipefail`。
      # ============================================================

      - name: 对拍回归 — 词法（--lexer）
        run: |
          set -o pipefail
          ./selfhost/diffcheck.sh --lexer 2>&1 | tail -3

      - name: 对拍回归 — 语法（--parser）
        run: |
          set -o pipefail
          ./selfhost/diffcheck.sh --parser 2>&1 | tail -3

      - name: 对拍回归 — 错误场景（--errors）
        run: |
          set -o pipefail
          ./selfhost/diffcheck.sh --errors 2>&1 | tail -3

      - name: 引擎一致性门 — 用户面默认轨（negative，Issue 51）
        run: |
          set -o pipefail
          ./selfhost/engine_parity.sh 2>&1 | tail -12

      - name: 子进程兜底回收门 — 僵尸泄漏（negative，Issue 54）
        run: |
          set -o pipefail
          ./selfhost/zombie_reap_check.sh 2>&1 | tail -12

      - name: 对拍回归 — codegen（--codegen）
        run: |
          set -o pipefail
          ./selfhost/diffcheck.sh --codegen 2>&1 | tail -5

      - name: 对拍回归 — 值系统（--value）
        run: |
          set -o pipefail
          ./selfhost/diffcheck.sh --value 2>&1 | tail -3

      - name: 对拍回归 — 解释器（--interp）
        run: |
          set -o pipefail
          ./selfhost/diffcheck.sh --interp 2>&1 | tail -3

      - name: 双轨内置一致性门 — 解释器 vs 编译（内置转发丢参，qg-issue 69）
        run: |
          set -o pipefail
          ./selfhost/interp_builtin_parity.sh 2>&1 | tail -14

      - name: 自举证明（pxc 编译 compiler.px 与基准一致）
        run: |
          set -o pipefail
          cd selfhost
          ./bootstrap_prove.sh 2>&1 | tail -6

  examples:
    name: 示例编译运行
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 编译并运行关键示例
        run: |
          chmod +x bootstrap/pxc bootstrap/pxi tools/pxc
          for ex in examples/fib.px examples/match.px examples/struct.px; do
            [ -f "$ex" ] || continue
            echo "── $ex"
            ./tools/pxc build "$ex" 2>&1 | tail -1
          done
          ./examples/build/fib | head -3

  toolchain:
    name: 工具链自举质量门（fmt + lint）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: fmt --check（selfhost + tools + stdlib 收敛域）
        run: |
          chmod +x bootstrap/pxfmt bootstrap/pxlint bootstrap/pxc
          set -e
          for f in selfhost/*.px tools/*.px stdlib/*.px; do
            ./bootstrap/pxfmt --check "$f" >/dev/null || { echo "❌ 格式不符: $f"; exit 1; }
          done
          echo "✅ fmt --check 全绿（selfhost+tools+stdlib）"
      - name: lint（compiler 主入口 + 独立工具文件）
        run: |
          chmod +x bootstrap/pxlint
          ./bootstrap/pxlint selfhost/compiler.px >/dev/null || { echo "❌ compiler.px 项目级 lint 失败"; exit 1; }
          for f in tools/fmt_core.px tools/fmtlexer.px tools/jsonrpc_core.px tools/lint_core.px tools/lsp_core.px tools/pxbench.px tools/pxcheck.px tools/pxdoc.px tools/pxfmt.px tools/pxlint.px tools/pxlsp.px tools/pxmcp.px tools/pxpkg.px tools/pxslice.px tools/pxtest.px tools/routegen.px; do
            ./bootstrap/pxlint "$f" >/dev/null || { echo "❌ lint 失败: $f"; exit 1; }
          done
          echo "✅ lint 全绿（compiler 主入口 0 错 + tools 16 文件 0/0）"
      - name: 内置名册防漂移（单一事实源：runtime 注册表 → lint_core.px 生成块）
        run: |
          bash selfhost/builtin_list_check.sh
      - name: 生态索引防漂移（stdlib → ecosystem_index.json + native_index.json + ECOSYSTEM/CHEATSHEET 同步）
        run: |
          chmod +x bootstrap/pxi
          ./bootstrap/pxi tools/gen_ecosystem.px
          bash tools/gen_native_table.sh
          git diff --exit-code -- docs/ecosystem_index.json docs/native_index.json || { echo "❌ stdlib/runtime 变更未同步生态/native 索引 → 重跑生成器并同步 docs/ECOSYSTEM.md 与 docs/PUXIAN_CHEATSHEET.md"; exit 1; }
          echo "✅ 生态索引与 stdlib 一致 + native 清单与 runtime 一致"
      - name: 工具自测（m64_fmt / m64_lint / m65_lsp / m65_mcp + m66_yaml/pxml/lunar + m71_mcp_build + m82_http_serve_unix + m116/m117/m118 真实缺陷用例）
        # ⚠️ 每条 verify **必须独立成行**：GitHub Actions 默认 shell 是 `bash -e {0}`，
        #    而 `set -e` **不**作用于 AND-OR 列表 —— `a && b` 里 a 失败只令该列表返回
        #    非零、**不会**中止脚本（实测 `bash -ec 'false && true; echo X'` 仍打印 X、
        #    rc=0）。写成 `a && b` 就把 a 的失败吞掉了，步照绿。
        #    实锤（M114 尾）：本步长期自称「全 PASS」，而 m64_fmt / m65_mcp 实际 rc=1
        #    （两者都在等早已不存在的 0.1.0 版本串，二进制从 M-某 起就是 0.2.0）。
        #    登记：qg-issue 64。⇒ 新增门时**不要**用 `&&` 串联命令。
        run: |
          bash examples/m64_fmt/verify.sh > /tmp/v_m64_fmt.log 2>&1 || { echo "❌ m64_fmt verify 失败"; tail -40 /tmp/v_m64_fmt.log; exit 1; }
          bash examples/m64_lint/verify.sh > /tmp/v_m64_lint.log 2>&1 || { echo "❌ m64_lint verify 失败"; tail -40 /tmp/v_m64_lint.log; exit 1; }
          python3 -c "import sys; assert sys.version_info[0]==3"
          bash examples/m65_lsp/verify.sh > /tmp/v_m65_lsp.log 2>&1 || { echo "❌ m65_lsp verify 失败"; tail -40 /tmp/v_m65_lsp.log; exit 1; }
          bash examples/m65_mcp/verify.sh > /tmp/v_m65_mcp.log 2>&1 || { echo "❌ m65_mcp verify 失败"; tail -40 /tmp/v_m65_mcp.log; exit 1; }
          bash examples/m66_yaml/verify.sh > /tmp/v_m66_yaml.log 2>&1 || { echo "❌ m66_yaml verify 失败"; tail -40 /tmp/v_m66_yaml.log; exit 1; }
          bash examples/m66_pxml/verify.sh > /tmp/v_m66_pxml.log 2>&1 || { echo "❌ m66_pxml verify 失败"; tail -40 /tmp/v_m66_pxml.log; exit 1; }
          bash examples/m66_lunar/verify.sh > /tmp/v_m66_lunar.log 2>&1 || { echo "❌ m66_lunar verify 失败"; tail -40 /tmp/v_m66_lunar.log; exit 1; }
          bash examples/m71_mcp_build/verify.sh > /tmp/v_m71_mcp_build.log 2>&1 || { echo "❌ m71_mcp_build verify 失败"; tail -40 /tmp/v_m71_mcp_build.log; exit 1; }
          bash examples/m82_http_serve_unix/verify.sh > /tmp/v_m82_http_serve_unix.log 2>&1 || { echo "❌ m82_http_serve_unix verify 失败"; tail -40 /tmp/v_m82_http_serve_unix.log; exit 1; }
          bash examples/m116_builtin_semantics/verify.sh > /tmp/v_m116_builtin_semantics.log 2>&1 || { echo "❌ m116_builtin_semantics verify 失败"; tail -40 /tmp/v_m116_builtin_semantics.log; exit 1; }
          bash examples/m117_realworld_defects/verify.sh > /tmp/v_m117_realworld_defects.log 2>&1 || { echo "❌ m117_realworld_defects verify 失败"; tail -40 /tmp/v_m117_realworld_defects.log; exit 1; }
          bash examples/m118_realworld_defects/verify.sh > /tmp/v_m118_realworld_defects.log 2>&1 || { echo "❌ m118_realworld_defects verify 失败"; tail -40 /tmp/v_m118_realworld_defects.log; exit 1; }
          bash examples/m119_multiline_expr/verify.sh > /tmp/v_m119_multiline_expr.log 2>&1 || { echo "❌ m119_multiline_expr verify 失败"; tail -40 /tmp/v_m119_multiline_expr.log; exit 1; }
          bash examples/m120_dict_strict/verify.sh > /tmp/v_m120_dict_strict.log 2>&1 || { echo "❌ m120_dict_strict verify 失败"; tail -40 /tmp/v_m120_dict_strict.log; exit 1; }
          bash examples/m122_builtin_args/verify.sh > /tmp/v_m122_builtin_args.log 2>&1 || { echo "❌ m122_builtin_args verify 失败"; tail -40 /tmp/v_m122_builtin_args.log; exit 1; }
          # ── 第 17 轮补：M130–M137 常驻门（此前只在本地跑 ⇒ CI 无防线）──
          # ⚠️ m136 需要 Go（真 encoding/json 产真值），本工作流无 Go 步骤 ⇒ 刻意不列入
          #    （它在 selfhost/m116_gates.sh 的本地全门里跑）。
          bash examples/m130_flock_chmod/verify.sh > /tmp/v_m130.log 2>&1 || { echo "❌ m130_flock_chmod verify 失败"; tail -40 /tmp/v_m130.log; exit 1; }
          bash examples/m131_http_stream_post/verify.sh > /tmp/v_m131.log 2>&1 || { echo "❌ m131_http_stream_post verify 失败"; tail -40 /tmp/v_m131.log; exit 1; }
          bash examples/m132_sse_chunked/verify.sh > /tmp/v_m132.log 2>&1 || { echo "❌ m132_sse_chunked verify 失败"; tail -40 /tmp/v_m132.log; exit 1; }
          bash examples/m133_http_unix_timeout/verify.sh > /tmp/v_m133.log 2>&1 || { echo "❌ m133_http_unix_timeout verify 失败"; tail -40 /tmp/v_m133.log; exit 1; }
          bash examples/m134_gc_obj_roots/verify.sh > /tmp/v_m134.log 2>&1 || { echo "❌ m134_gc_obj_roots verify 失败"; tail -40 /tmp/v_m134.log; exit 1; }
          bash examples/m137_sse_connect_ex/verify.sh > /tmp/v_m137.log 2>&1 || { echo "❌ m137_sse_connect_ex verify 失败"; tail -40 /tmp/v_m137.log; exit 1; }
          bash examples/m138_regex_go_parity/verify.sh > /tmp/v_m138.log 2>&1 || { echo "❌ m138_regex_go_parity verify 失败"; tail -40 /tmp/v_m138.log; exit 1; }
          bash examples/m139_bare_ident_stmt/verify.sh > /tmp/v_m139.log 2>&1 || { echo "❌ m139_bare_ident_stmt verify 失败"; tail -40 /tmp/v_m139.log; exit 1; }
          bash examples/m140_http_conn_errno/verify.sh > /tmp/v_m140.log 2>&1 || { echo "❌ m140_http_conn_errno verify 失败"; tail -40 /tmp/v_m140.log; exit 1; }
          bash examples/m141_now_ns/verify.sh > /tmp/v_m141.log 2>&1 || { echo "❌ m141_now_ns verify 失败"; tail -40 /tmp/v_m141.log; exit 1; }
          bash examples/m142_go_json_indent/verify.sh > /tmp/v_m142.log 2>&1 || { echo "❌ m142_go_json_indent verify 失败"; tail -40 /tmp/v_m142.log; exit 1; }
          bash examples/m143_float32/verify.sh > /tmp/v_m143.log 2>&1 || { echo "❌ m143_float32 verify 失败"; tail -40 /tmp/v_m143.log; exit 1; }
          bash examples/m144_http_bigbody/verify.sh > /tmp/v_m144.log 2>&1 || { echo "❌ m144_http_bigbody verify 失败"; tail -40 /tmp/v_m144.log; exit 1; }
          bash examples/m145_cycle_safe/verify.sh > /tmp/v_m145.log 2>&1 || { echo "❌ m145_cycle_safe verify 失败"; tail -40 /tmp/v_m145.log; exit 1; }
          bash examples/m146_float64_bits/verify.sh > /tmp/v_m146.log 2>&1 || { echo "❌ m146_float64_bits verify 失败"; tail -40 /tmp/v_m146.log; exit 1; }
          bash examples/m147_fmt_dec/verify.sh > /tmp/v_m147.log 2>&1 || { echo "❌ m147_fmt_dec verify 失败"; tail -40 /tmp/v_m147.log; exit 1; }
          bash examples/m148_ieee_div/verify.sh > /tmp/v_m148.log 2>&1 || { echo "❌ m148_ieee_div verify 失败"; tail -40 /tmp/v_m148.log; exit 1; }
          bash examples/m149_tcp_deadline/verify.sh > /tmp/v_m149.log 2>&1 || { echo "❌ m149_tcp_deadline verify 失败"; tail -40 /tmp/v_m149.log; exit 1; }
          bash examples/m150_tls_crypto/verify.sh > /tmp/v_m150.log 2>&1 || { echo "❌ m150_tls_crypto verify 失败"; tail -40 /tmp/v_m150.log; exit 1; }
          bash examples/m151_pg_tls_bytes/verify.sh > /tmp/v_m151.log 2>&1 || { echo "❌ m151_pg_tls_bytes verify 失败"; tail -40 /tmp/v_m151.log; exit 1; }
          # M153（第 35 轮）：常量池 / 短串池化（缺陷 145）+ 分配统计 + 缺陷 147。
          # 含三轨语义 / 分配预算硬阈值 / 输出冻结 / 3 道负控（负控会重编 runtime，耗时数分钟）。
          bash examples/m153_alloc/verify.sh > /tmp/v_m153.log 2>&1 || { echo "❌ m153_alloc verify 失败"; tail -60 /tmp/v_m153.log; exit 1; }
          # M154（第 36 轮）：分配率第二刀 —— 小整数 str() 池 + 多字节 rune 池 + join 字节精确
          # （缺陷 149：内嵌 NUL 不再被 strlen 截断）+ 常量池按指针哈希 + 比较器同一性快路径。
          # 含三轨语义（57 断言）/ 分配预算硬阈值 / 输出冻结 / 3 道负控（负控会重编 runtime）。
          bash examples/m154_alloc2/verify.sh > /tmp/v_m154.log 2>&1 || { echo "❌ m154_alloc2 verify 失败"; tail -60 /tmp/v_m154.log; exit 1; }
          # M155（第 37 轮）：含内嵌 NUL 的字符串 —— 字面量/常量池/渲染/输出四段（缺陷 148/150/151/152）。
          # 含三轨语义（41 断言 × 3 轨）+ stdout/落盘原始字节逐字节 + 发射形状 + 4 道负控（负控会重编 runtime）。
          bash examples/m155_nul_bytes/verify.sh > /tmp/v_m155.log 2>&1 || { echo "❌ m155_nul_bytes verify 失败"; tail -60 /tmp/v_m155.log; exit 1; }
          # M156（第 38 轮）：零依赖 ONNX 解析面（结构 + 权重字节）。
          bash examples/m156_onnx/verify.sh > /tmp/v_m156.log 2>&1 || { echo "❌ m156_onnx verify 失败"; tail -60 /tmp/v_m156.log; exit 1; }
          # M157（第 39 轮）：ONNX 执行面 —— 张量/64 算子/拓扑执行器；三方对拍 + 覆盖率 + 负控。
          bash examples/m157_onnx_exec/verify.sh > /tmp/v_m157.log 2>&1 || { echo "❌ m157_onnx_exec verify 失败"; tail -60 /tmp/v_m157.log; exit 1; }
          # M158（第 40 轮）：解释轨函数值 → runtime native 桥（缺陷 114）+ type 口径（缺陷 161）。
          # 三轨一致 + 负控会重编解释器（耗时长）⇒ CI 用 --neg-skip，负控在本地全门 m116 跑。
          bash examples/m158_interp_fn/verify.sh --neg-skip > /tmp/v_m158.log 2>&1 || { echo "❌ m158_interp_fn verify 失败"; tail -60 /tmp/v_m158.log; exit 1; }
          # 发射冻结门（M153 建立）：255 个用例的 --emit-c 输出必须逐字节不变。
          bash selfhost/emitc_freeze.sh --check > /tmp/v_emitc_freeze.log 2>&1 || { echo "❌ emitc_freeze 失败"; tail -30 /tmp/v_emitc_freeze.log; exit 1; }
          echo "✅ m64_fmt / m64_lint / m65_lsp / m65_mcp / m66_yaml / m66_pxml / m66_lunar / m71_mcp_build / m82_http_serve_unix / m116_builtin_semantics / m117_realworld_defects / m118_realworld_defects / m119_multiline_expr / m120_dict_strict / m122_builtin_args / m130–m134 / m137 / m138 / m139 / m140 / m141 / m142 / m143 / m144 / m145 / m146 / m147 / m148 / m149 / m150 / m151 / m153 / m154 / m155 / m158 verify + 发射冻结门（255 件 --emit-c）全 PASS（m136 需 Go，在 selfhost/m116_gates.sh 本地全门里）"
      - name: LSP / MCP 服务器冒烟（--version + 协议入口存在性）
        run: |
          chmod +x bootstrap/pxlsp bootstrap/pxmcp bootstrap/pxcheck
          ./tools/pxc lsp --version
          ./tools/pxc mcp --version
          ./bootstrap/pxcheck --version
          echo "✅ pxlsp / pxmcp / pxcheck 就绪"
      - name: 发布侧守卫自测（Issue 41 单调性守卫 + Issue 56 发布包内容/可复现 + Issue 86 tag 守卫）
        # ⚠️ 沿用 Issue 64 的教训：**每条独立成行**，不要用 `&&` 串联（`&&` 会吞掉前件失败）。
        run: |
          bash packaging/selftest_rpm_monotonic_guard.sh
          bash packaging/selftest_make_release.sh
          bash packaging/selftest_tag_guard.sh
          echo "✅ 发布侧守卫自测全绿（41：旧覆盖新必红 · 56：内容同构 + 位级可复现 · 86：最高里程碑缺 tag 必红）"
      - name: M67 x86_64 native 档（m67_multiarch：hello/http/sqlite + gc_stress/gc_single GC 压力）
        run: |
          bash examples/m67_multiarch/verify.sh --arch x86_64 >/dev/null
          echo "✅ M67 x86_64 档（含 gc_stress 并发 4 worker + gc_single 3 万迭代 GC 压力）PASS"

  multiarch-cross:
    name: 多架构交叉编译 + qemu 验证（${{ matrix.arch }}，M67）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armv7, riscv64]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 qemu-user-static
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static
          qemu-aarch64-static --version | head -1

      - name: 映射交叉工具链（arch → musl.cc tarball URL / 解压目录 / zig target）
        id: musl-map
        run: |
          case "${{ matrix.arch }}" in
            aarch64) URL=https://musl.cc/aarch64-linux-musl-cross.tgz;       DIR=aarch64-linux-musl-cross;      ZT=aarch64-linux-musl;      PRE=aarch64-linux-musl ;;
            armv7)   URL=https://musl.cc/armv7l-linux-musleabihf-cross.tgz;  DIR=armv7l-linux-musleabihf-cross; ZT=arm-linux-musleabihf;    PRE=armv7l-linux-musleabihf ;;
            riscv64) URL=https://musl.cc/riscv64-linux-musl-cross.tgz;       DIR=riscv64-linux-musl-cross;      ZT=riscv64-linux-musl;      PRE=riscv64-linux-musl ;;
          esac
          echo "URL=$URL" >> "$GITHUB_OUTPUT"
          echo "DIR=$DIR" >> "$GITHUB_OUTPUT"
          echo "ZT=$ZT" >> "$GITHUB_OUTPUT"
          echo "PRE=$PRE" >> "$GITHUB_OUTPUT"

      - name: 缓存交叉工具链目录（musl.cc 解压 / zig wrapper 同布局）
        id: cache-musl
        uses: actions/cache@v4
        with:
          path: /opt/muslcc/${{ steps.musl-map.outputs.DIR }}
          key: muslcc-${{ matrix.arch }}-v1

      - name: 缓存 zig cc（路 2 fallback，55MB 覆盖三架构 musl 交叉）
        id: cache-zig
        uses: actions/cache@v4
        with:
          path: /opt/zig
          key: zig-x86_64-linux-0.16.0-v1

      - name: 下载交叉工具链（路1 musl.cc 快速失败 → 路2 zig cc fallback）
        id: dl
        if: steps.cache-musl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/muslcc /opt/zig && sudo chown "$USER" /opt/muslcc /opt/zig
          URL="${{ steps.musl-map.outputs.URL }}"
          DIR="${{ steps.musl-map.outputs.DIR }}"
          ZT="${{ steps.musl-map.outputs.ZT }}"
          PRE="${{ steps.musl-map.outputs.PRE }}"
          ok=0
          # ---- 路 1：musl.cc tarball（2 次快速尝试，不通即弃保 CI 时效）----
          for i in 1 2; do
            echo "── [路1 musl.cc] 尝试 $i/2: $URL"
            if curl -4 -fL -A "Mozilla/5.0 (X11; Linux x86_64) puxian-ci" \
                --retry 1 --connect-timeout 12 --max-time 240 \
                -o /tmp/cc.tgz "$URL" 2>/tmp/cc.err \
                && [ -s /tmp/cc.tgz ] \
                && tar tzf /tmp/cc.tgz >/dev/null 2>&1; then
              echo "✅ 路1 musl.cc 下载成功（$(du -h /tmp/cc.tgz | cut -f1)）"
              tar xzf /tmp/cc.tgz -C /opt/muslcc
              echo "TOOLCHAIN=muslcc" >> "$GITHUB_OUTPUT"
              ok=1
              break
            fi
            echo "  ⚠️ 路1 失败：$(head -c 300 /tmp/cc.err 2>/dev/null | tr '\n' ' ')"
            rm -f /tmp/cc.tgz
            sleep 3
          done
          [ "$ok" = 1 ] && exit 0
          # ---- 路 2：zig cc fallback（ziglang.org；zig 单文件 = 三架构 musl 交叉 clang）----
          echo "── [路2 zig] musl.cc runner 侧不可达，切换 zig cc"
          if [ ! -x /opt/zig/zig ]; then
            curl -4 -fL -A "Mozilla/5.0 puxian-ci" --retry 3 --retry-all-errors \
                --connect-timeout 15 --max-time 600 \
                -o /tmp/zig.tar.xz \
                "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
            tar xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
            rm -f /tmp/zig.tar.xz
          fi
          /opt/zig/zig version
          # 生成 <triple>-gcc/ar/ranlib wrapper 到 /opt/muslcc/$DIR/bin（对齐 musl.cc 布局，后续 PATH 复用零改动）
          BIN="/opt/muslcc/$DIR/bin"
          mkdir -p "$BIN"
          printf '#!/bin/sh\nexec /opt/zig/zig cc -target %s "$@"\n' "$ZT" > "$BIN/$PRE-gcc"
          printf '#!/bin/sh\nexec /opt/zig/zig ar "$@"\n'            > "$BIN/$PRE-ar"
          printf '#!/bin/sh\nexec /opt/zig/zig ranlib "$@"\n'        > "$BIN/$PRE-ranlib"
          chmod +x "$BIN/$PRE-gcc" "$BIN/$PRE-ar" "$BIN/$PRE-ranlib"
          echo "✅ 路2 zig wrapper 就绪：$BIN（$PRE-gcc → zig cc -target $ZT）"
          echo "TOOLCHAIN=zig" >> "$GITHUB_OUTPUT"

      - name: 交叉工具链就绪
        run: /opt/muslcc/${{ steps.musl-map.outputs.DIR }}/bin/*-gcc --version | head -1

      - name: 缓存现编交叉静态库（armv7/riscv64；aarch64 仓库预置免编）
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: /opt/px-multiarch
          key: px-libs-${{ matrix.arch }}-v2

      - name: 现编 armv7/riscv64 交叉库（缓存未命中）
        if: steps.cache-libs.outputs.cache-hit != 'true' && matrix.arch != 'aarch64'
        run: |
          export PATH=/opt/muslcc/${{ steps.musl-map.outputs.DIR }}/bin:$PATH
          mkdir -p /opt/px-multiarch
          tools/cross_multiarch.sh --arch ${{ matrix.arch }} --outdir /opt/px-multiarch/${{ matrix.arch }}

      - name: 交叉编译 + qemu 验证（${{ matrix.arch }}）
        run: |
          export PATH=/opt/muslcc/${{ steps.musl-map.outputs.DIR }}/bin:$PATH
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            bash examples/m67_aarch64/verify.sh          # 阶段一三用例（aarch64 一等支持）
          fi
          bash examples/m67_multiarch/verify.sh --arch ${{ matrix.arch }}

      - name: M159 交叉自举档（x86_64 → aarch64 · musl 静态 · 只对 aarch64 档做）
        if: matrix.arch == 'aarch64'
        run: |
          set -e
          export PATH=/opt/muslcc/${{ steps.musl-map.outputs.DIR }}/bin:$PATH
          ./selfhost/native_bootstrap.sh --target-arch aarch64 --outdir /tmp/nb-a64
          file /tmp/nb-a64/pxc
          file -b /tmp/nb-a64/pxc | grep -q "ARM aarch64" || { echo "❌ 产物不是 aarch64"; exit 1; }
          file -b /tmp/nb-a64/pxc | grep -q "static"      || { echo "❌ 产物不是静态链接"; exit 1; }
          echo "── qemu 下真跑自举件（第三方报告 R1002 的现场就在这一步）"
          qemu-aarch64-static /tmp/nb-a64/pxc --version
          mkdir -p /tmp/nb-a64/s && printf 'print("a64-boot-ok")\n' > /tmp/nb-a64/s/h.px
          qemu-aarch64-static /tmp/nb-a64/pxc build /tmp/nb-a64/s/h.px > /tmp/nb-a64/s/h.c
          grep -q "a64-boot-ok" /tmp/nb-a64/s/h.c || { echo "❌ 生成的 C 缺字面量"; exit 1; }
          wc -l /tmp/nb-a64/s/h.c
          echo "✅ M159 交叉自举档：aarch64 静态自举件可用（qemu 实测）"

      - name: cross_multiarch.sh / cross_aarch64.sh 冒烟（存在性 + 语法）
        run: |
          [ -f tools/cross_multiarch.sh ] || { echo "❌ 缺 tools/cross_multiarch.sh"; exit 1; }
          [ -f tools/cross_aarch64.sh ] || { echo "❌ 缺 tools/cross_aarch64.sh"; exit 1; }
          bash -n tools/cross_multiarch.sh
          bash -n tools/cross_aarch64.sh
          echo "✅ cross_multiarch.sh / cross_aarch64.sh 存在且语法 OK（发布包已含）"

  # ============================================================
  # M159（R45 · 缺口 G4）：**原生 aarch64 自举自证** —— 全仓此前只在 x86_64 上自举，
  #   aarch64 档只做"交叉编译 + qemu 跑用例"（examples/m67_aarch64），**从不**问
  #   「在 aarch64 上从源码自举能不能成」。第三方仓库 px-openEuler-bootstrap 正是填这条缝
  #   （并报告了 gcc11-aarch64 上 pxc0 编译 compiler.px 报 R1002 索引 null）。
  #   本 job 把这条链变成官方能力（只用 runner 自带 gcc）：
  #     ① selfhost/native_bootstrap.sh：编 runtime → 用基准 golden/compiler.c 编原生 pxc0
  #        → **自证**（pxc0 编 compiler.px 与基准逐字节一致）——R1002 若存在，必在此步红；
  #     ② 把现编原生 pxc 装成工具链，验证**裸 `px build` 在 aarch64 上零参数可用**
  #        （M159 宿主机架构自适应：自动 lib-aarch64 + 自动 --no-quic）；
  #     ③ 跑 m159_hostarch 门（宿主架构决策）。
  #   GitHub 公开仓库可用 arm64 runner（ubuntu-24.04-arm），故这条覆盖不再需要自备机器。
  # ============================================================
  native-arm64:
    name: 原生 aarch64 自举自证 + 裸 build（gcc-only，M159）
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境自述（宿主架构 / gcc / libc —— R1002 现场取证用）
        run: |
          uname -m; uname -sr
          gcc --version | head -1
          ldd --version | head -1
          ls -la bootstrap/ | head -20

      - name: 原生自举（gcc-only）—— 含自证：pxc0 编 compiler.px ↔ golden/compiler.c
        run: |
          bash selfhost/native_bootstrap.sh --outdir "$RUNNER_TEMP/nb" 2>&1 | tee "$RUNNER_TEMP/nb.log"
          test -x "$RUNNER_TEMP/nb/pxc"
          grep -q "NATIVE-BOOTSTRAP-OK" "$RUNNER_TEMP/nb.log"

      - name: 现编其余原生工具（pxi / pxl / pxpar）并装成工具链（仅本 run 生效，不入库）
        # 口径：`bootstrap/pxc build <f>` 只把 C 写到 stdout，链接/runtime 缓存由 tools/px 负责
        #   ⇒ 先把**原生 pxc** 顶上 bootstrap/pxc，再用 tools/px 的 **C 轨**（--c）现编其余件。
        #   VM 轨（用户面默认）需要入库 pxc_vm（x86_64），本 job 不用它，故全程 PX_BUILD_ENGINE=c。
        run: |
          set -e
          cp -f "$RUNNER_TEMP/nb/pxc" bootstrap/pxc
          for e in "pxi|selfhost/interp.px" "pxl|selfhost/lexer.px" "pxpar|selfhost/parser.px"; do
            n="${e%%|*}"; s="${e#*|}"
            PX_BUILD_ENGINE=c tools/px build "$s" 2>&1 | tail -1
            out="$(dirname "$s")/build/$(basename "$s" .px)"
            [ -x "$out" ] || { echo "❌ $n 现编失败（缺产物 $out）"; exit 1; }
            cp -f "$out" "bootstrap/$n"
            echo "✅ bootstrap/$n（原生 aarch64 现编，$(stat -c %s "bootstrap/$n") 字节）"
          done
          file bootstrap/pxc bootstrap/pxi bootstrap/pxl bootstrap/pxpar | sed 's/^/   /'

      - name: 裸 px build / px run 冒烟（**零参数**，靠 M159 宿主架构自适应）
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          printf 'print("native-aarch64-ok")\\n' > hello.px
          # 仓库根有 .px_modules / stdlib 依赖 → 用仓库内的 tools/px（PX_STDLIB 自发现）
          cd "$GITHUB_WORKSPACE"
          echo "── 计划（应自动 lib-aarch64 + no_quic=1 + **engine 自动落 C 轨**）"
          tools/px build --print-plan "$RUNNER_TEMP/smoke/hello.px" | tee /tmp/plan.txt
          grep -q "^plan: engine=c" /tmp/plan.txt || { echo "❌ 计划未自动落 C 轨（aarch64 上 VM 轨不可用）"; exit 1; }
          grep -q "^plan: no_quic=1" /tmp/plan.txt || { echo "❌ 计划未自动裁 QUIC"; exit 1; }
          echo "── 裸 build（零参数：自动 C 轨 + lib-aarch64 + no-quic）"
          tools/px build "$RUNNER_TEMP/smoke/hello.px" 2>&1 | tail -3
          out="$RUNNER_TEMP/smoke/build/hello"
          file "$out"
          ldd "$out" 2>&1 | head -3 || true
          test "$("$out")" = "native-aarch64-ok" && echo "✅ 原生 aarch64 产物运行正确"
          echo "── 解释轨（pxi 原生）"
          tools/px run "$RUNNER_TEMP/smoke/hello.px"

      - name: 宿主机架构自适应门（m159_hostarch）
        env:
          PX_BUILD_ENGINE: c
        run: bash examples/m159_hostarch/verify.sh

      - name: 交叉档冒烟（确认 aarch64 原生宿主上交叉档仍可用）
        run: |
          bash -n tools/cross_aarch64.sh
          bash -n tools/cross_multiarch.sh
          echo "✅ 交叉脚本语法 OK（详细交叉档由 multiarch-cross job 在 x86_64 上跑）"

      - name: 失败时留现场（自举日志）
        if: failure()
        run: |
          echo "──── native_bootstrap 日志尾部 ────"
          tail -60 "$RUNNER_TEMP/nb.log" 2>/dev/null || true
          echo "──── pxc0 自证 stderr ────"
          tail -40 "$RUNNER_TEMP/nb/B.err" 2>/dev/null || true
