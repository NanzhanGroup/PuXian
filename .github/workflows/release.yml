# ============================================================
# Release —— PuXian GitHub Release 自动发布（tag 驱动，M62）
# ------------------------------------------------------------
# 触发：推送 tag v*（如 v0.1.0-m62）到 GitHub
# 流程：ubuntu-latest 检出（含 tag 历史）→ tools/make_release.sh
#       构建发布包（版本号自 tag 派生，见脚本"版本来源"段）
#       → 收集 tarball / SHA-256 / 上一 tag 起的提交列表
#       → gh CLI 创建 GitHub Release 并上传 tarball（GITHUB_TOKEN，零第三方 action）
# 产物：GitHub Release 资产 puxian-<VER>-<sha>.tar.gz（M274 起去冗余：里程碑号已在版本第三段）
# 发布 SOP：
#   git tag v0.1.0-m62            # 版本决策：v<主版本>-m<里程碑>
#   git push origin v0.1.0-m62    # 触发本 workflow（main 需已含对应代码）
# 冒烟：make_release.sh 默认内置解包自检（pxc --version / hello 编译运行 /
#       解释运行 / import std.* 定位 / 包外 PX_STDLIB），任一失败即 workflow 失败
# ============================================================
name: Release

on:
  push:
    tags: ['v*']
  # ============================================================
  # M331：**补资产入口**（tag push 事件丢失时的重放通道）
  # ------------------------------------------------------------
  # 2026-10-26 实况：v0.2.325/326/327/330 四条 tag **推送成功**
  #   （GitHub 侧 pushed_at=09:24:49Z 有记录、peeled commit 逐个对得上），
  #   但 `push: tags` 事件**未被派发给本 workflow** —— runs=0、releases/tags/* → 404，
  #   且此后再无任何运行。仓库侧逐项排查（workflow state=active · 触发条件完好 ·
  #   release.yml blob 与上次成功发布逐字节相同 · actor 与上次成功同一账户 ·
  #   GitHub Status 无事件 · main 的 push 正常起 CI/tag-guard）均无异常 ⇒ 派发侧丢事件。
  # 后果不是「页面缺几条」：tools/install.sh 取 releases/latest ⇒ 一键安装退回旧树。
  # 此前唯一补救手段是「删 tag 重推」，但那是被禁的（重推会把 Release 转草稿、破坏版本序列）。
  # 本入口给出一条**合法**的重放路径：
  #   gh workflow run release.yml -f tag=v0.2.330
  #   gh workflow run release.yml -f tag=v0.2.325 -f assets_only=true
  #   （或 POST /repos/{owner}/{repo}/actions/workflows/release.yml/dispatches）
  # ⚠️ dispatch 时 github.ref_name 是**分支名 main**，不是 tag ⇒ 必须用 input.tag，
  #   并由下方各 checkout 的 ref 指过去；shell 里一律读 $PX_RELEASE_TAG，不再读 GITHUB_REF_NAME。
  # ============================================================
  workflow_dispatch:
    inputs:
      tag:
        description: '要重建资产的 tag（如 v0.2.330，必须已在远端）'
        required: true
        type: string
      assets_only:
        description: '只补 Release 资产（跳过 rpm 构建与 gh-pages 发布）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# ---- 发布目标 tag 的唯一来源（M331） ----
# push 路径：github.ref_name = 该 tag；dispatch 路径：取 input.tag（否则会把 main 当 tag 发）
env:
  PX_RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

# ---- Issue 41-B：串行化发布 ----
# 根治"较晚完成的旧版本发布覆盖新版本"（2026-09-11 实况：m111 先发、m110 后发覆盖）。
# cancel-in-progress: false 是刻意的 —— 发布**不可被打断**（中断会留下半推送的仓库树）。
concurrency:
  group: ${{ github.workflow }}-publish
  cancel-in-progress: false

jobs:
  release:
    name: 构建发布包 + 创建 GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码（含 tag 历史，供 git describe 与提交列表）
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: 发布目标自证（M331：dispatch 路径必须证明「检出的树 = 该 tag 的树」）
        # 负控：若 render 接线写错（拿 main 当 tag 发），本步必须变红而不是照发。
        # 旧行为（无此步）就是 dispatch 时默默把 main 的树当成 tag 发布 —— 比丢失资产更坏。
        run: |
          set -euo pipefail
          TAG="$PX_RELEASE_TAG"
          echo "发布目标 tag: $TAG（事件=${{ github.event_name }}）"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) printf '::error::tag 形状不合法（应形如 v0.2.330）：%s\n' "$TAG"; exit 1 ;;
          esac
          git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null \
            || { printf '::error::远端不存在该 tag：%s\n' "$TAG"; exit 1; }
          HEAD_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          echo "HEAD  = $HEAD_SHA"
          echo "tag^  = $TAG_SHA"
          [ "$HEAD_SHA" = "$TAG_SHA" ] \
            || { printf '::error::检出的树不是 %s 指向的提交 ⇒ 拒绝发布（避免把 main 当 tag 发出去）\n' "$TAG"; exit 1; }
          echo "✅ 发布目标自证通过：HEAD == $TAG"

      - name: 构建发布包（版本自 tag 派生 + 内置冒烟自检）
        run: |
          chmod +x tools/pxc tools/make_release.sh bootstrap/pxc bootstrap/pxi bootstrap/pxl bootstrap/pxpar
          tools/make_release.sh

      - name: 收集产物与提交列表
        id: meta
        run: |
          PKG="$(ls -t /tmp/puxian-*.tar.gz | head -1)"
          [ -n "$PKG" ] || { echo "❌ 未找到发布包"; exit 1; }
          SHA256SUMS="$(dirname "$PKG")/sha256sums.txt"
          [ -f "$SHA256SUMS" ] || { echo "❌ 未找到 sha256sums.txt（M71-S4 make_release 应生成）"; exit 1; }
          echo "TAG=${PX_RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "PKG=${PKG}" >> "$GITHUB_OUTPUT"
          echo "PKG_NAME=$(basename "$PKG")" >> "$GITHUB_OUTPUT"
          echo "SHA256SUMS=${SHA256SUMS}" >> "$GITHUB_OUTPUT"
          echo "SHA256=$(sha256sum "$PKG" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          # 提交列表：上一 tag → 本 tag；首个 tag 用最近 40 条
          PREV="$(git describe --tags --abbrev=0 "${PX_RELEASE_TAG}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            RANGE="$PREV..${PX_RELEASE_TAG}"
          else
            RANGE="HEAD~40..HEAD"
          fi
          git log --oneline --no-merges "$RANGE" > /tmp/commits.txt || true
          echo "COMMITS_LINES=$(wc -l < /tmp/commits.txt)" >> "$GITHUB_OUTPUT"

      - name: 创建 GitHub Release 并上传资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.TAG }}"
          PKG="${{ steps.meta.outputs.PKG }}"
          PKG_NAME="${{ steps.meta.outputs.PKG_NAME }}"
          SHA256SUMS="${{ steps.meta.outputs.SHA256SUMS }}"
          SHA256="${{ steps.meta.outputs.SHA256 }}"
          LINES="${{ steps.meta.outputs.COMMITS_LINES }}"
          {
            echo "## PuXian ${TAG}"
            echo ""
            echo "发布包：\`${PKG_NAME}\`（M71-S4 起附 \`sha256sums.txt\`，\`tools/install.sh\` 一键安装自动校验）"
            echo ""
            echo "- SHA-256: \`${SHA256}\`"
            echo "- 里程碑范围：上一 tag 至本 tag（首个 tag 为最近 40 条）"
            echo ""
            echo "### 本版提交（${LINES} 条）"
            echo '```'
            cat /tmp/commits.txt
            echo '```'
          } > /tmp/notes.md
          # M206：**幂等**且**资产一定到位**的发布步（三种形态都要走通）：
          #   ① 无 release（正常）  ② 已发布（同 tag 重定基）  ③ **草稿**（tag 被删/重推时
          #   GitHub 把 release 转草稿，而 `gh release view` **看不到草稿**，Assets 也会空）
          # 旧实现 = 一次 `gh release create` ⇒ 命中 ②/③ 必然失败，且注解只有 `exit code 1`
          #   （Release #133 实测）；更要命的是**资产一个都没传**（release 空壳）。
          # 现在：不存在则 create（不带资产，避免 create 失败把资产一起丢掉），
          #   然后**无条件** upload --clobber + edit（notes/title + `--draft=false` 草稿转正）。
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ℹ️ 无可见 release ⇒ 创建空壳（资产随后统一上传）"
            gh release create "$TAG" --title "PuXian ${TAG}" --notes-file /tmp/notes.md \
              --repo "$GITHUB_REPOSITORY" || true
          else
            echo "ℹ️ Release $TAG 已存在 ⇒ 幂等更新（资产覆盖 + notes/标题 + 草稿转正）"
          fi
          gh release upload "$TAG" "$PKG" "$SHA256SUMS" --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false \
            --title "PuXian ${TAG}" --notes-file /tmp/notes.md
          echo "✅ GitHub Release 就绪: ${TAG}（tarball=$PKG_NAME + sha256sums.txt）"
          # 清理与**当前 tag 提交**不符的陈旧 tarball 资产（重定基会留下旧 commit 前缀的包）
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null \
            | while IFS= read -r name; do
                [ -n "$name" ] || continue
                case "$name" in
                  "$PKG_NAME"|sha256sums.txt) ;;
                  puxian-bootstrap-aarch64-*) ;;
                  *.tar.gz|*.tar.gz.sha256)
                    echo "🧹 清理陈旧资产（与当前 tag 提交不符）: $name"
                    gh release delete-asset "$TAG" "$name" -y --repo "$GITHUB_REPOSITORY" || true ;;
                esac
              done

  # ============================================================
  # M159（R45 · 缺口 G1）：**aarch64 自举件**做成一等发布资产
  # ------------------------------------------------------------
  # 缺口（第三方仓库照出来）：入库 bootstrap/* 只有 x86_64 件 ⇒ aarch64 用户解压主包后
  #   `px build` 直接 Exec format error，只能自己搓自举链 —— banshanhanfu/px-openEuler-bootstrap
  #   正是为填这条缝而生的第三方仓。
  # 本 job 在 GitHub **原生 arm64 runner** 上从源码现编一整套 aarch64 工具链（**含自证**：
  #   自举出的 pxc 编译 compiler.px 与入库 golden 逐字节一致），打成并列资产
  #   `puxian-bootstrap-aarch64-<tag>.tar.gz`（包内 bootstrap/* 即 aarch64 原生件，解压即可用）。
  # 为何不塞进主包：主包 bootstrap/* 受「全件源码链指纹门」（selfhost/rebake_bin.sh
  #   --check-all）与发布包可复现性守卫（Issue 56）约束 —— 跨 runner 现编件不进那套记账，
  #   故单独成资产、单独带 sha256。
  # ============================================================
  # ============================================================
  # M159（R45 · 缺口 G1）：**aarch64 自举件**做成一等发布资产
  # M168（2026-09-21 用户报障）：**包内工具链必须与 glibc 版本解耦**
  # ------------------------------------------------------------
  # 缺口一（M159，第三方仓库照出来）：入库 bootstrap/* 只有 x86_64 件 ⇒ aarch64 用户
  #   解压主包后 `px build` 直接 Exec format error，只能自己搓自举链。
  # 缺口二（M168，用户实测报出）：本 job 原先把 pxc 交给 runner 的**系统 gcc 动态链接**
  #   （CROSS=0 时 LINK_EXTRA 为空）⇒ 发布包里的 pxc 带 `GLIBC_2.38` 需求，而 openEuler
  #   22.03 只有 glibc 2.34 ⇒ **装上了、跑不起来**；而 runner 自己就是 2.38，**CI 永远绿**。
  # 本 job 现在（M168）：
  #   ① `native_bootstrap.sh --portable` —— 强制 -static，并在脚本内接
  #      `selfhost/check_bin_portability.sh`（auto 档下不是全静态即判红）；
  #   ② 现编 **全部** 12 件原生工具（不再只 pxc/pxi/pxl/pxpar —— 否则包里混着
  #      x86_64 的 pxfmt/pxlint/… 用户一跑就 Exec format error）；
  #   ③ VM 轨两件（pxc_vm / pxi_vm）**不随包发布**：它们由 x86_64 侧 `--emit-c` 产出，
  #      且 aarch64 上 `tools/px` 会自动落 C 轨（M159 宿主架构自适应，CI 有断言）；
  #   ④ 包前跑**可移植性门**（全静态 + 架构 aarch64），任何一件不合规即 job 红；
  #   ⑤ 仍保留自证：自举出的 pxc 编译 compiler.px 与入库 golden/compiler.c 逐字节一致。
  # ============================================================
  bootstrap-arm64:
    name: aarch64 自举件（原生 arm64 runner · gcc-only · 全静态 · 含自证）
    needs: [release]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: 环境自述（宿主 / gcc / libc / 静态 libc —— 取证用）
        run: |
          uname -m; uname -sr
          gcc --version | head -1
          ldd --version | head -1
          # 静态链接需要静态 libc：debian/ubuntu 在 libc6-dev 里（默认已装），
          # 缺了本 job 会红（**不静默降级**为动态件 —— 那正是 M168 要治的病）
          ls -l /usr/lib/aarch64-linux-gnu/libc.a 2>/dev/null || sudo apt-get install -y libc6-dev
          ls -l /usr/lib/aarch64-linux-gnu/libc.a

      - name: 原生自举 + 自证（--portable：全静态 + pxc0 编 compiler.px ↔ golden/compiler.c）
        run: |
          set -o pipefail
          if ! bash selfhost/native_bootstrap.sh --portable --outdir "$RUNNER_TEMP/nb" 2>&1 | tee "$RUNNER_TEMP/nb.log"; then
            echo "::error::原生自举失败（--portable）"
            tail -40 "$RUNNER_TEMP/nb.log" | sed 's/^/::error::nb /'; exit 1
          fi
          grep -q "NATIVE-BOOTSTRAP-OK" "$RUNNER_TEMP/nb.log" || { tail -30 "$RUNNER_TEMP/nb.log" | sed 's/^/::error::nb /'; exit 1; }
          grep -q "static=1" "$RUNNER_TEMP/nb.log" || { echo "::error::自举件不是全静态"; grep NATIVE-BOOTSTRAP "$RUNNER_TEMP/nb.log" | sed 's/^/::error::nb /'; exit 1; }
          test -x "$RUNNER_TEMP/nb/pxc"

      - name: 现编全部 12 件原生工具（C 轨；VM 轨两件不随包）
        # M201：件清单与 **flag**（解释器件 `--full`）只有一处 —— `selfhost/build_native_tools.sh`。
        #   原先本步与 ci.yml 各写一遍循环，而漂移的代价已实测：发布链的**自动裁剪**把
        #   zlib/sqlite/xml/aes/rsa/ed25519/zip/ws **整族**从 `bootstrap/pxi` 裁掉
        #   （已发布 aarch64 包实测：pxc 有 19 个 zlib_* 名字，pxi 0 个）⇒ 官方 zlib 包
        #   在解释轨完全不可用（= 第三方 PX-DEF-035）。
        run: |
          set -e
          cp -f "$RUNNER_TEMP/nb/pxc" bootstrap/pxc
          if ! bash selfhost/build_native_tools.sh --dir bootstrap --no-check 2>&1 | tee "$RUNNER_TEMP/bnt.log"; then
            echo "::error::原生工具现编失败"; grep -E '❌' "$RUNNER_TEMP/bnt.log" | sed 's/^/::error::bnt /'; exit 1
          fi
          ls -l bootstrap/

      - name: M201 解释器能力面门（PX-DEF-035：解释器件必须**全能力**）
        # 判据 = `native_symbols()`（本构建可作为全局调用的 native 名）必须**包含**源码里
        #   注册的整个期望集；负控用一个**真被裁过**的产物（--no-zlib）证明判据有牙。
        run: |
          set -e
          if ! bash examples/m201_interp_ffi/verify.sh --interp "$PWD/bootstrap/pxi" > "$RUNNER_TEMP/ffi.log" 2>&1; then
            echo "::error::解释器能力面门判红（族缺失 ⇒ 官方库在解释轨不可用）"
            sed 's/^/::error::ffi /' "$RUNNER_TEMP/ffi.log"; exit 1
          fi
          tail -12 "$RUNNER_TEMP/ffi.log"

      - name: 可移植性门（全静态 + 架构 aarch64 —— 每一件都过，否则 job 红）
        run: |
          set -e
          # 失败诊断走 `::error::` 注释：它在 run 摘要里**第一眼**可见 —— 首跑红时正是靠它定位。
          # ⚠️ M251s1 更正（缺陷 443）：此前记的「job 日志非管理员不可读（API 403）」是**错的** ——
          #   完整日志可读：`python3 selfhost/ci_log.py log <job_id>`。
          if ! bash selfhost/check_bin_portability.sh --self-test > "$RUNNER_TEMP/pst.log" 2>&1; then
            echo "::error::可移植性门自证失败（--self-test）"
            sed 's/^/::error::pst /' "$RUNNER_TEMP/pst.log"; exit 1
          fi
          cat "$RUNNER_TEMP/pst.log"
          if ! bash selfhost/check_bin_portability.sh --arch aarch64 --require-static bootstrap/* \
                 > "$RUNNER_TEMP/portability.log" 2>&1; then
            echo "::error::可移植性门判红（有件不是 aarch64 全静态）"
            sed 's/^/::error::portability /' "$RUNNER_TEMP/portability.log"; exit 1
          fi
          cat "$RUNNER_TEMP/portability.log"
          echo "✅ 包内 $(ls bootstrap/* | wc -l) 件全部：aarch64 + 全静态（与 glibc 版本解耦）"

      - name: 冒烟（**零参数**裸 px build + px run）
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/s" && cd "$RUNNER_TEMP/s"
          printf 'print("aarch64-pkg-ok")\n' > h.px
          cd "$GITHUB_WORKSPACE"
          tools/px build --print-plan "$RUNNER_TEMP/s/h.px"
          tools/px build "$RUNNER_TEMP/s/h.px" 2>&1 | tail -2
          test "$("$RUNNER_TEMP/s/build/h")" = "aarch64-pkg-ok"
          tools/px run "$RUNNER_TEMP/s/h.px" | grep -q aarch64-pkg-ok
          echo "✅ aarch64 包内工具链零参数可用"

      - name: 打包（bootstrap/ + tools/ + runtime/ + stdlib/ + VERSION）
        run: |
          set -e
          TAG="${PX_RELEASE_TAG}"
          STAGE="$RUNNER_TEMP/pkg/puxian-bootstrap-aarch64-${TAG}"
          # 上面「现编 11 件」会把中间产物落在 tools/build/ 与仓库根的 .rtcache/
          #   ⇒ 发布包**不得夹带构建产物**（Issue 56 的同一口径，主包由白名单复制守；
          #      本包由下面这条硬断言守）。先删，再断言。
          rm -rf tools/build selfhost/build .rtcache
          mkdir -p "$STAGE"
          cp -a bootstrap tools runtime stdlib "$STAGE"/ 2>/dev/null || true
          rm -f "$STAGE"/bootstrap/pxc_vm "$STAGE"/bootstrap/pxi_vm   # 双保险（见上）
          # ============================================================
          # M199（缺陷 239）：**架构卫生** —— 包内不得夹带**异架构/跨平台构建输入**
          #   实测（v0.2.0-m191 及更早的 aarch64 包）：包内带着 x86-64 的
          #     runtime/third_party/sqlite3/sqlite3.o、sqlite3-windows.o（COFF）、
          #     runtime/mbedtls/lib/*.a、runtime/third_party/zlib/lib/*.a、
          #     runtime/third_party/{openssl,ngtcp2}/lib/*.a
          #   ⇒ ① 白送体积；② **错架构陷阱**：aarch64 用户按 README 的路径家族显式
          #      `--sqlite-obj runtime/third_party/sqlite3/sqlite3.o` 会拿到
          #      `file in wrong format`（错误信息**指不到根因**）。
          #   本包是**单架构**（aarch64）包 ⇒ 只保留 aarch64 的构建输入（`-aarch64` 目录/文件）。
          #   ⚠️ openssl/ngtcp2 的 x86-64 静态库在本包内**本就不可用**（aarch64 上 QUIC/H3 已裁剪，
          #      见 README-aarch64.md）⇒ 一并删除，不留"看起来能用"的陷阱。
          # ============================================================
          rm -f "$STAGE"/runtime/third_party/sqlite3/sqlite3.o \
                "$STAGE"/runtime/third_party/sqlite3/sqlite3-windows.o
          rm -rf "$STAGE"/runtime/third_party/openssl/lib "$STAGE"/runtime/third_party/ngtcp2/lib
          rm -rf "$STAGE"/runtime/mbedtls/lib "$STAGE"/runtime/mbedtls/lib-windows
          rm -rf "$STAGE"/runtime/third_party/zlib/lib "$STAGE"/runtime/third_party/zlib/lib-windows
          if ! bash selfhost/check_pkg_arch.sh --self-test > "$RUNNER_TEMP/pst_arch.log" 2>&1; then
            echo "::error::架构卫生门自证失败"; sed 's/^/::error::arch-selftest /' "$RUNNER_TEMP/pst_arch.log"; exit 1
          fi
          if ! bash selfhost/check_pkg_arch.sh --arch aarch64 "$STAGE" > "$RUNNER_TEMP/pkg_arch.log" 2>&1; then
            echo "::error::包内夹带异架构/跨平台构建输入（架构卫生门判红）"
            grep -E '❌|统计' "$RUNNER_TEMP/pkg_arch.log" | sed 's/^/::error::pkg-arch /'; exit 1
          fi
          grep -E '── 统计' "$RUNNER_TEMP/pkg_arch.log"
          # 裁掉异架构输入之后，**从包内**再跑一次零参数 build（证明没裁掉 aarch64 必需项）
          mkdir -p "$RUNNER_TEMP/psmoke"
          printf 'print("pruned-ok")\n' > "$RUNNER_TEMP/psmoke/h.px"
          if ! ( cd "$STAGE" && PATH="$STAGE/tools:$PATH" timeout 600 tools/px build "$RUNNER_TEMP/psmoke/h.px" ) \
                 > "$RUNNER_TEMP/psmoke.log" 2>&1; then
            echo "::error::裁剪后**包内** build 失败（可能裁掉了 aarch64 必需项）"
            tail -8 "$RUNNER_TEMP/psmoke.log" | sed 's/^/::error::psmoke /'; exit 1
          fi
          test "$("$RUNNER_TEMP/psmoke/build/h")" = "pruned-ok" \
            || { echo "::error::裁剪后包内构建产物运行输出异常"; exit 1; }
          echo "✅ 架构卫生：包内仅 aarch64 构建输入，且**包内**零参数 build + 运行通过"
          # ⚠️ 上面那次「包内 build」**会合法地**在 $STAGE 里生成 `.rtcache/`（工具链的 runtime 缓存
          #    就落在工具根）—— 但发布包**不得夹带**它（下一行的硬断言会当场判红：M199 Release #124
          #    aarch64 job 正是红在这里，注解 `包内夹带 .rtcache/` 一眼读出真因）。
          #    ⇒ 自证跑完立刻清掉（顺序：先自证、后清、再断言）。
          rm -rf "$STAGE/.rtcache" "$STAGE/tools/build" "$STAGE/selfhost/build"
          [ ! -e "$STAGE/tools/build" ] || { echo "::error::包内夹带 tools/build/（Issue 56 回归）"; exit 1; }
          [ ! -e "$STAGE/.rtcache" ] || { echo "::error::包内夹带 .rtcache/"; exit 1; }
          [ -f VERSION ] && cp -f VERSION "$STAGE"/VERSION
          printf '%s\n' \
            "# PuXian aarch64 自举件（bootstrap-aarch64 · ${TAG}）" "" \
            "本包由 GitHub 原生 arm64 runner **从源码现编**（gcc-only）·**包内 12 件全部为" \
            "aarch64 原生 **静态** 二进制**（零动态库依赖 ⇒ 不再绑定某个 glibc 版本）。" \
            "自证：自举出的 pxc 编译 selfhost/compiler.px 与入库 golden/compiler.c 逐字节一致。" "" \
            "为什么强调「静态」：v0.2.0-m167 及更早的 aarch64 包内 pxc 是动态件（需 GLIBC_2.38），" \
            "在 openEuler 22.03（glibc 2.34）/ 较老的 Debian 上「装得上、跑不起来」。" \
            "现在包内每一件都过 selfhost/check_bin_portability.sh（全静态 + 架构 aarch64）。" "" \
            "用法（解压后）：" "" \
            "    export PATH=\$PWD/tools:\$PATH" \
            "    px build hello.px && ./build/hello" \
            "    px run hello.px" "" \
            "说明：" \
            "- 宿主非 x86_64 时 tools/px 会自动切 C 轨，并自动使用 runtime/*/lib-aarch64 布局" \
            "  + 裁剪 QUIC/H3（该平台无预编译 ngtcp2/openssl-quictls）。" \
            "- VM 轨件（bootstrap/pxc_vm、pxi_vm）**不随本包发布**：它们由 x86_64 侧 --emit-c" \
            "  产出；aarch64 上 `px build` 自动走 C 轨（等价产物，见 README「三轨」说明）。" \
            "- 其余可现编：./bootstrap/pxc build tools/pxfmt.px   # 产物落 tools/build/pxfmt" \
            "- 或在任意 aarch64 机器上自举整套：./selfhost/native_bootstrap.sh --portable --install" "" \
            "校验：sha256sum -c puxian-bootstrap-aarch64-${TAG}.tar.gz.sha256" \
            > "$STAGE/README-aarch64.md"
          ( cd "$RUNNER_TEMP/pkg" && tar czf "puxian-bootstrap-aarch64-${TAG}.tar.gz" "puxian-bootstrap-aarch64-${TAG}" )
          cd "$RUNNER_TEMP/pkg"
          sha256sum "puxian-bootstrap-aarch64-${TAG}.tar.gz" > "puxian-bootstrap-aarch64-${TAG}.tar.gz.sha256"
          ls -l; cat "puxian-bootstrap-aarch64-${TAG}.tar.gz.sha256"

      - name: 上传 aarch64 自举件到 Release（并列资产）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${PX_RELEASE_TAG}"
          cd "$RUNNER_TEMP/pkg"
          PKG="puxian-bootstrap-aarch64-${TAG}.tar.gz"
          ls -l
          # ⚠ 必须显式 --repo：本步骤 cwd 在 $RUNNER_TEMP 下（**不在 git 仓库内**），
          #   gh 无法从本地仓库推断目标 ⇒ 会以 "not a git repository" 收场（m159 首跑即栽此）。
          if ! gh release upload "$TAG" "$PKG" "$PKG.sha256" --clobber --repo "$GITHUB_REPOSITORY"; then
            echo "::error::gh release upload 失败（tag=$TAG repo=$GITHUB_REPOSITORY cwd=$PWD）"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" 2>&1 | sed 's/^/::error::release /' || true
            exit 1
          fi
          echo "✅ 已上传 $PKG（并列主包资产）"
          # ── M311 · C1：把 aarch64 包**并入** sha256sums.txt（统一校验清单）────────
          #   为什么：`make_release.sh` 只把主包写进清单，aarch64 包只有 sidecar
          #   ⇒ 下载者用「一个清单核全部资产」时核不到它（M310 D5 实测；
          #     packaging/check_release_assets.sh 对**已发布的 M310 资产**实测判红）。
          #   口径：清单是**唯一权威**；sidecar 保留向后兼容，两者不许矛盾（A3 判据守）。
          #   幂等：先剔除同名旧行再追加（重跑/重定基不会产生重复或旧哈希）。
          SD="$RUNNER_TEMP/sums"; mkdir -p "$SD"
          if gh release download "$TAG" -p sha256sums.txt -D "$SD" --repo "$GITHUB_REPOSITORY"; then
            HASH="$(sha256sum "$PKG" | awk '{print $1}')"
            # ⚠️ 写回**同名文件**再 upload（不用 `file#name` 语法：gh release upload 对它的支持
            #    随版本而异，发布链里不赌这个）
            awk -v n="$PKG" '$2 != n' "$SD/sha256sums.txt" > "$SD/sums.tmp" || true
            printf '%s  %s\n' "$HASH" "$PKG" >> "$SD/sums.tmp"
            mv "$SD/sums.tmp" "$SD/sha256sums.txt"
            cat "$SD/sha256sums.txt"
            gh release upload "$TAG" "$SD/sha256sums.txt" --clobber --repo "$GITHUB_REPOSITORY"
            echo "✅ 已把 aarch64 包并入 sha256sums.txt（$HASH）"
          else
            echo "::error::下载 sha256sums.txt 失败（tag=$TAG）—— 清单不全会让校验面出现缺口"
            exit 1
          fi

  # ============================================================
  # M311 · C2 —— 发布资产 ⇄ 校验清单 **双向核对**（发布链的最后一关）
  # ------------------------------------------------------------
  # 为什么单独一个 job：C1 只保证「我们写进去了」，本 job 保证「**从 Release 上取回来的**
  #   资产集合与清单完全对得上」—— 即判据作用在**已发布物**上，而不是本地工作目录。
  # 判据见 packaging/check_release_assets.sh（A1 每个 tarball 在清单且哈希一致 ·
  #   A2 清单无悬空条目 · A3 sidecar ⇄ 清单不许矛盾 · A4 aarch64 包必须在 · A5 规模锚点）。
  # ============================================================
  assets-verify:
    needs: [release, bootstrap-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 1
      - name: 核对发布资产与校验清单（双向）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${PX_RELEASE_TAG}"
          D="$RUNNER_TEMP/assets"; mkdir -p "$D"
          gh release download "$TAG" -D "$D" --repo "$GITHUB_REPOSITORY"
          ls -l "$D"
          bash packaging/check_release_assets.sh "$D" "$TAG"

  # ============================================================
  # rpm —— 构建签名 RPM 仓库并发布到 GitHub Pages（M73 dnf + M77 el7 yum）
  # ------------------------------------------------------------
  # 前置：GitHub Actions secrets 配置正式签名子密钥后自动启用：
  #   GPG_PRIVATE_KEY = gpg --export-secret-subkeys <子>! | gpg --armor --symmetric 的输出
  #   GPG_PASSPHRASE  = 该加密导出的 passphrase（若子密钥无 passphrase 可留空）
  #   GPG_KEY_ID      = 子密钥指纹（gpg --list-secret-keys --keyid-format LONG）
  # 密钥未配置时各 job 自动跳过（绿色占位），不阻塞发布。
  # 结构（构建与发布分离，避免并发 push 冲突；矩阵加 dist 即扩版本）：
  #   rpm-build-7  ubuntu + docker run centos:7（EOL vault 源修复）→ 无签名构建
  #                el7 rpm + yum 3.4 运行自检 → artifact pxrepo-7
  #   rpm-build-9  rockylinux:9 容器（真实 el9 语义）→ 构建 el9 签名仓库并代签 el7
  #                （rpm4.16 loopback，规避 el7 rpm4.11/gpg2.0 headless 缺陷）
  #                → 合并 rpm/{7,9} → artifact pxrepo-all
  #                + **真编译运行**（M168 补：只跑 --version 看不见动态件的 glibc 问题）
  #   rpm-verify-openeuler  openEuler 22.03/24.03 容器（M168 新增）：dnf 双验签 + 安装
  #                + 真编译运行 —— 用户报障的 openEuler 支持自此有真验收
  #   rpm-publish  needs rpm-build-9 → download pxrepo-all → rsync 推送 gh-pages
  # 发布后用户（packaging/install-rpm.sh）：
  #   EL9: sudo bash install-rpm.sh && dnf install puxian
  #   EL7: sudo bash install-rpm.sh && yum install puxian
  #   openEuler 22.03/24.03: sudo bash install-rpm.sh && dnf install puxian
  # baseurl: https://soft.xiusoft.cn/puxian/rpm/...   （国内镜像·默认；探测失败回退上游）
  # 目录语义（M168 起**显式化** —— openEuler 的 $releasever 是 22.03LTS，靠它展开必然 404）：
  #   rpm/7/x86_64 · rpm/9/x86_64   ← RHEL 系（repo 文件用 $releasever/$basearch）
  #   rpm/openeuler/<ver>/x86_64    ← openEuler（repo 文件写**字面**目录；元数据 gz）
  # 目录语义：rpm/7/x86_64 与 rpm/9/x86_64（$releasever 展开，EL 系通用）
  # ============================================================
  rpm-build-9:
    name: 构建 el9 签名 RPM 仓库并代签 el7（rockylinux:9）
    runs-on: ubuntu-latest
    container: rockylinux:9
    needs: [rpm-build-7]
    timeout-minutes: 30
    steps:
      - name: 检查 GPG 签名密钥是否就绪（未配置则跳过发布）
        id: gpgkey
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "✅ GPG_PRIVATE_KEY 已配置，rpm 发布启用"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "⏸ GPG_PRIVATE_KEY 未配置 —— rpm 发布待密钥（见 packaging/README 第二步）"
          fi

      - name: 安装 rpm 工具链（el9 容器内）
        if: steps.gpgkey.outputs.ok == 'true'
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            rpm-build rpm-sign createrepo_c gnupg2 git rsync gcc tar binutils >/dev/null
          echo "✅ 工具就绪: $(rpmbuild --version | head -1), $(rpmsign --version | head -1), $(createrepo_c --version | head -1)"

      - name: 检出代码（含 tag 历史，build_rpm.sh 依赖 git describe）
        if: steps.gpgkey.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: 信任工作区（容器内 git safe.directory，规避 dubious ownership）
        if: steps.gpgkey.outputs.ok == 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory '*'
          echo "✅ safe.directory: $GITHUB_WORKSPACE (+ *)"

      - name: 导入签名私钥（CI 子密钥，headless 签名）
        if: steps.gpgkey.outputs.ok == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          # CI 无交互终端：放行 loopback pinentry + 加长缓存，供 rpm --addsign 复用
          printf 'allow-loopback-pinentry\ndefault-cache-ttl 7200\nmax-cache-ttl 7200\n' > ~/.gnupg/gpg-agent.conf
          gpgconf --reload gpg-agent
          if [ -n "$GPG_PASSPHRASE" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --import
          else
            echo "$GPG_PRIVATE_KEY" | gpg --batch --yes --import
          fi
          # 导入校验
          gpg --list-secret-keys --keyid-format LONG | grep -E '^(sec|ssb)' || { echo "❌ 私钥导入失败"; exit 1; }
          # 预缓存 passphrase：先 detach-sign 一次，agent 缓存期内 rpm --addsign / gpg 签名免交互
          if [ -n "$GPG_PASSPHRASE" ] && [ -n "$GPG_KEY_ID" ]; then
            echo "puxian ci sign preflight" > /tmp/sigtest
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
                --local-user "$GPG_KEY_ID" --detach-sign -o /tmp/sigtest.sig /tmp/sigtest
            echo "✅ passphrase 已缓存（loopback preflight）"
          fi
          echo "✅ 签名密钥就绪"

      - name: 构建 + 签名 RPM 仓库（build_rpm.sh 全链路）
        if: steps.gpgkey.outputs.ok == 'true'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          DIST: '9'          # 目录=releasever（dnf $releasever 展开 9 → rpm/9/x86_64）
          REPO_OUT: /tmp/pxrepo
        run: |
          chmod +x tools/pxc tools/make_release.sh bootstrap/pxc bootstrap/pxi
          bash packaging/build_rpm.sh

      - name: dnf 本地仓库自检（file:// 双验签 makecache）
        if: steps.gpgkey.outputs.ok == 'true'
        run: |
          cat > /etc/yum.repos.d/puxian-selfcheck.repo <<'EOF'
          [puxian-selfcheck]
          name=PuXian Selfcheck Repo
          baseurl=file:///tmp/pxrepo/9/x86_64/
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=file:///tmp/pxrepo/PUXIAN-GPG-KEY.asc
          EOF
          # -y：CI 无 tty，自动接受 gpgkey 导入（否则 dnf 交互询问 → 拒签 Bad GPG signature）
          dnf -q -y makecache 2>&1 | tail -5 || { echo "❌ 仓库验签失败"; exit 1; }
          dnf -q -y --repo=puxian-selfcheck repoquery puxian || { echo "❌ repoquery 找不到 puxian"; exit 1; }
          echo "✅ dnf makecache 双验签通过（repomd.xml.asc + 包签名）"

      - name: 入库件可移植性门（M168：全静态 —— pxc_vm 曾是动态件，在 el7 上必崩）
        if: steps.gpgkey.outputs.ok == 'true'
        run: |
          chmod +x selfhost/check_bin_portability.sh
          bash selfhost/check_bin_portability.sh --self-test
          bash selfhost/check_bin_portability.sh --arch x86_64 --require-static bootstrap/*

      - name: 下载 el7 未签名 RPM 产物（rpm-build-7 构建，供本 job 代签）
        if: steps.gpgkey.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          name: pxrepo-7
          path: /tmp/art7

      - name: 代签 el7 RPM + 组 el7 仓库（rpm4.16 loopback，与 el9 同一条已验证链路）
        if: steps.gpgkey.outputs.ok == 'true'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          EL7RPM="$(find /tmp/art7 -name 'puxian-*.el7.*.rpm' | head -1)"
          [ -n "$EL7RPM" ] || { echo "❌ 未找到 el7 rpm 产物"; exit 1; }
          echo "el7 rpm: $EL7RPM"
          mkdir -p /tmp/pxrepo/7/x86_64
          cp "$EL7RPM" /tmp/pxrepo/7/x86_64/
          RPK7="/tmp/pxrepo/7/x86_64/$(basename "$EL7RPM")"
          PASSFILE=/tmp/.gpg-pass-el7
          printf '%s' "$GPG_PASSPHRASE" > "$PASSFILE"
          chmod 600 "$PASSFILE"
          rpm --define "_gpg_name $GPG_KEY_ID" \
              --define "__gpg_sign_cmd %{__gpg} gpg --batch --yes --pinentry-mode loopback --passphrase-file $PASSFILE --no-armor --no-secmem-warning -u %{_gpg_name} -sbo %{__signature_filename} %{__plaintext_filename}" \
              --addsign "$RPK7"
          echo "== el7 repodata（createrepo_c gzip，兼容 yum3.4）=="
          createrepo_c --compress-type=gz /tmp/pxrepo/7/x86_64/ >/dev/null
          echo "== el7 repomd.xml 签名 =="
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$PASSFILE" --armor --detach-sign \
              -o /tmp/pxrepo/7/x86_64/repodata/repomd.xml.asc /tmp/pxrepo/7/x86_64/repodata/repomd.xml
          rm -f "$PASSFILE"
          echo "== el7 rpm 签名自检（rpm -Kv）=="
          rpm --import /tmp/pxrepo/PUXIAN-GPG-KEY.asc
          rpm -Kv "$RPK7" | tail -4
          echo "✅ el7 已代签并组仓（/tmp/pxrepo/7/x86_64）"

      - name: 组 openEuler 别名仓库（M168：同包同签名 · 元数据 gz 兼容老 libdnf）
        if: steps.gpgkey.outputs.ok == 'true'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          # 为什么需要别名目录（2026-09-21 用户报障）：
          #   openEuler 的 $releasever 是 22.03LTS，而仓库树按 RHEL 语义只有 7/9 ⇒
          #   baseurl 展开必然 404。修法不是「改用户的 releasever」，而是**目录显式化**：
          #   rpm/openeuler/<ver>/x86_64/ 放**同一批已签名 rpm**（openEuler 22.03 的
          #   glibc 2.34 == el9 基线，二进制兼容），由 install-rpm.sh 写**字面** baseurl。
          # 元数据用 gz：createrepo_c 默认 zstd，各版本 libdnf/dnf 支持度不一，gz 是最大公约数。
          PASSFILE=/tmp/.gpg-pass-oe
          printf '%s' "$GPG_PASSPHRASE" > "$PASSFILE"; chmod 600 "$PASSFILE"
          for ver in 22.03 24.03; do
            d="/tmp/pxrepo/openeuler/$ver/x86_64"
            mkdir -p "$d"
            cp /tmp/pxrepo/9/x86_64/puxian-*.rpm "$d/"
            createrepo_c --compress-type=gz "$d" >/dev/null
            gpg --batch --yes --pinentry-mode loopback --passphrase-file "$PASSFILE" --armor --detach-sign \
                -o "$d/repodata/repomd.xml.asc" "$d/repodata/repomd.xml"
            echo "✅ openEuler $ver 别名仓库就绪：$d"
            ls "$d"
          done
          rm -f "$PASSFILE"
          echo "== 仓库树 =="
          find /tmp/pxrepo -maxdepth 3 -type d | sort

      - name: 上传 el7+el9 合并仓库产物（pxrepo-all）
        if: steps.gpgkey.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pxrepo-all
          path: /tmp/pxrepo
          if-no-files-found: error

      - name: 密钥未配置提示（占位，保持 job 绿）
        if: steps.gpgkey.outputs.ok != 'true'
        run: |
          echo "⏸ 本次跳过 rpm 发布。启用方法（正式密钥就绪后无需改代码）："
          echo "   1. 在仓库 Settings → Secrets and variables → Actions 配置："
          echo "      GPG_PRIVATE_KEY / GPG_PASSPHRASE / GPG_KEY_ID"
          echo "   2. 下一个 tag（v0.2.0 / v0.1.0-mXX）自动构建签名 RPM 仓库并发布（el7 + el9）"
          echo "   3. 用户侧: sudo bash packaging/install-rpm.sh && dnf install puxian"

  rpm-build-7:
    name: 构建 el7 RPM + 运行自检（centos:7，未签名，由 el9 job 代签）
    # M331：补资产路径可一键跳过整条 rpm 链（el7/el9/openEuler 构建 + gh-pages 发布）。
    # 为何要跳：① 补资产只差 Release 资产，rpm 仓库只保留**最新版**且自带单调性守卫，
    #   为旧 tag 重发 rpm 会与守卫打架；② 四个历史 tag 各跑一遍 rpm 链纯属浪费。
    # 下游 rpm-build-9 / rpm-verify-7 / rpm-verify-openeuler / rpm-publish 都以它为前提，
    # 一处跳过即整链 skipped（skipped 不算失败，与 GPG 未配置时的既有行为同口径）。
    if: ${{ !inputs.assets_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检查 GPG 签名密钥是否就绪（未配置则跳过发布）
        id: gpgkey
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "✅ GPG_PRIVATE_KEY 已配置，el7 rpm 发布启用"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "⏸ GPG_PRIVATE_KEY 未配置 —— el7 rpm 发布跳过"
          fi

      - name: 检出代码（含 tag 历史；centos:7 跑不了 node actions，故构建走 docker run）
        if: steps.gpgkey.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: 准备 el7 仓库输出目录（挂载给 centos:7 容器）
        if: steps.gpgkey.outputs.ok == 'true'
        run: mkdir -p /tmp/pxrepo7 && echo "✅ /tmp/pxrepo7 就绪"

      - name: centos:7 容器无签名构建 + 运行自检（build_rpm_el7.sh；签名由 rpm-build-9 代签）
        if: steps.gpgkey.outputs.ok == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -v /tmp/pxrepo7:/out \
            -e GPG_PRIVATE_KEY="$GPG_PRIVATE_KEY" \
            -e GPG_PASSPHRASE="$GPG_PASSPHRASE" \
            -e GPG_KEY_ID="$GPG_KEY_ID" \
            centos:7 \
            bash /src/packaging/build_rpm_el7.sh

      - name: 上传 el7 未签名仓库产物（pxrepo-7，供 rpm-build-9 代签）
        if: steps.gpgkey.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pxrepo-7
          path: /tmp/pxrepo7
          if-no-files-found: error

      - name: 密钥未配置提示（占位，保持 job 绿）
        if: steps.gpgkey.outputs.ok != 'true'
        run: echo "⏸ 本次跳过 el7 rpm 发布（GPG_PRIVATE_KEY 未配置）"

  rpm-verify-7:
    name: el7 正式签名仓库终验（centos:7 + yum 3.4 双验签 + 安装）
    runs-on: ubuntu-latest
    needs: [rpm-build-9]
    timeout-minutes: 30
    steps:
      - name: 检查 GPG 签名密钥是否就绪（未配置则跳过）
        id: gpgkey
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 检出代码（含 packaging/verify_repo_el7.sh，挂载给 centos:7 容器）
        if: steps.gpgkey.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: 下载 el7+el9 合并签名仓库产物
        if: steps.gpgkey.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          name: pxrepo-all
          path: /tmp/pxrepo

      - name: centos:7 容器 yum 双验签 + 安装 puxian（verify_repo_el7.sh）
        if: steps.gpgkey.outputs.ok == 'true'
        run: |
          set -o pipefail
          if ! docker run --rm \
                 -v "$GITHUB_WORKSPACE:/src" \
                 -v /tmp/pxrepo:/out \
                 centos:7 \
                 bash /src/packaging/verify_repo_el7.sh 2>&1 | tee "$RUNNER_TEMP/el7.log"; then
            bash "$GITHUB_WORKSPACE/packaging/annotate_failure.sh" el7 "$RUNNER_TEMP/el7.log"
            exit 1
          fi

      - name: 密钥未配置提示（占位，保持 job 绿）
        if: steps.gpgkey.outputs.ok != 'true'
        run: echo "⏸ 本次跳过 el7 终验（GPG_PRIVATE_KEY 未配置）"

  # ============================================================
  # M168：**openEuler 终验** —— 用户报障的另一半
  # ------------------------------------------------------------
  # 背景：install-rpm.sh 原先根本不认 openEuler（`❌ 暂支持 RHEL 系 7/9`），仓库树也只有
  #   rpm/{7,9}（openEuler 的 $releasever = 22.03LTS ⇒ 必然 404）。这类"缺一条分发链"
  #   在 CI 里**不可见**，因为 CI 只跑 centos:7 / rockylinux:9。
  # 本 job 在**真 openEuler 容器**里把整条链走完：写 repo → dnf 双验签 makecache →
  #   安装 puxian → pxc --version → **真编译一个程序并运行**（默认 VM 轨）。
  # 为什么必须"真编译"：VM 轨编译器（bootstrap/pxc_vm）历史上是动态件，在 glibc 较老的
  #   发行版上"装得上、跑不起来"；只跑 --version 的验证**永远发现不了**（M168 实测）。
  # ============================================================
  rpm-verify-openeuler:
    name: openEuler 正式签名仓库终验（22.03 / 24.03 · dnf 双验签 + 真编译运行）
    runs-on: ubuntu-latest
    needs: [rpm-build-9]
    # M168 实测：本 job 内含**两个容器**各自的「dnf 装 gcc 依赖 + 真编译一个程序」，
    #   而容器自带源（repo.openeuler.org）在境外 runner 上很慢 —— 40min 会在第二个版本线
    #   之前就被打断（首跑 22.03 单步就跑了 ~35min）。⇒ 提到 75min，避免"验证没跑完就红"。
    timeout-minutes: 75
    steps:
      - name: 检查 GPG 签名密钥是否就绪（未配置则跳过）
        id: gpgkey
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 检出代码（含 packaging/verify_repo_openeuler.sh）
        if: steps.gpgkey.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 1

      - name: 下载 el7+el9+openEuler 合并签名仓库产物
        if: steps.gpgkey.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          name: pxrepo-all
          path: /tmp/pxrepo

      - name: openEuler 22.03 LTS（dnf 双验签 → 装 puxian → 真编译运行）
        if: steps.gpgkey.outputs.ok == 'true'
        run: |
          set -o pipefail
          # 注解 = 唯一对外可读的失败通道（本仓 job 日志需管理员权限）
          if ! docker run --rm -v "$GITHUB_WORKSPACE:/src" -v /tmp/pxrepo:/out \
                 -e OE_VER=22.03 openeuler/openeuler:22.03-lts \
                 bash /src/packaging/verify_repo_openeuler.sh 2>&1 | tee "$RUNNER_TEMP/oe2203.log"; then
            bash "$GITHUB_WORKSPACE/packaging/annotate_failure.sh" oe2203 "$RUNNER_TEMP/oe2203.log"
            exit 1
          fi

      - name: openEuler 24.03 LTS（同上 · 另一条版本线）
        if: steps.gpgkey.outputs.ok == 'true'
        run: |
          set -o pipefail
          if ! docker run --rm -v "$GITHUB_WORKSPACE:/src" -v /tmp/pxrepo:/out \
                 -e OE_VER=24.03 openeuler/openeuler:24.03-lts \
                 bash /src/packaging/verify_repo_openeuler.sh 2>&1 | tee "$RUNNER_TEMP/oe2403.log"; then
            bash "$GITHUB_WORKSPACE/packaging/annotate_failure.sh" oe2403 "$RUNNER_TEMP/oe2403.log"
            exit 1
          fi

      - name: 密钥未配置提示（占位，保持 job 绿）
        if: steps.gpgkey.outputs.ok != 'true'
        run: echo "⏸ 本次跳过 openEuler 终验（GPG_PRIVATE_KEY 未配置）"

  rpm-publish:
    name: 合并发布 el7+el9 rpm 仓库到 GitHub Pages
    needs: [rpm-build-9]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检查 GPG 签名密钥是否就绪（未配置则跳过发布）
        id: gpgkey
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "✅ GPG_PRIVATE_KEY 已配置，合并发布启用"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "⏸ GPG_PRIVATE_KEY 未配置 —— 发布跳过"
          fi

      - name: 检出代码（取发布侧单调性守卫脚本 · Issue 41）
        if: steps.gpgkey.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 1

      - name: 下载 el7+el9 合并仓库产物
        if: steps.gpgkey.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          name: pxrepo-all
          path: /tmp/art/pxrepo-all

      - name: 就绪检查（rpm/{7,9} + openEuler 别名 + 公钥齐全）
        if: steps.gpgkey.outputs.ok == 'true'
        run: |
          mkdir -p /tmp/pxrepo
          rsync -a /tmp/art/pxrepo-all/ /tmp/pxrepo/
          [ -f /tmp/pxrepo/PUXIAN-GPG-KEY.asc ] || { echo "❌ 缺少 PUXIAN-GPG-KEY.asc"; exit 1; }
          [ -d /tmp/pxrepo/7/x86_64 ] || { echo "❌ 缺少 rpm/7/x86_64"; exit 1; }
          [ -d /tmp/pxrepo/9/x86_64 ] || { echo "❌ 缺少 rpm/9/x86_64"; exit 1; }
          # M168：openEuler 别名仓库必须一起发（否则 install-rpm.sh 认脸成功也取不到元数据）
          for v in 22.03 24.03; do
            [ -d "/tmp/pxrepo/openeuler/$v/x86_64" ] || { echo "❌ 缺少 rpm/openeuler/$v/x86_64"; exit 1; }
            [ -f "/tmp/pxrepo/openeuler/$v/x86_64/repodata/repomd.xml.asc" ] || { echo "❌ openEuler $v 缺 repomd.xml.asc"; exit 1; }
          done
          echo "== 仓库树 =="
          find /tmp/pxrepo -maxdepth 3 | sort | head -30
          echo "✅ el7+el9+openEuler 三套签名仓库就绪"

      - name: 发布到 gh-pages（rpm/ 树，只保留最新版）
        if: steps.gpgkey.outputs.ok == 'true'
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # M288s1：本步**必须自带诊断** —— 本仓 job 日志对非管理员不可读（API 403），
          #   **注解是唯一对外通道**；而内联时失败只报一句 `exit code 1`，读不出真因
          #   （2026-10-08 实测：该步 3s 就红，而成功时 20s ⇒ 卡点在很前面，但看不见是哪一条）。
          #   ⇒ 主体抽成 packaging/publish_gh_pages.sh（含 **逐段计时** ⏱），失败打一条富注解。
          #   （顺带：凭证改走 credential.helper，**不把 token 放进 URL**。）
          if ! bash "$GITHUB_WORKSPACE/packaging/publish_gh_pages.sh" 2>&1 | tee "$RUNNER_TEMP/ghpages.log"; then
            bash "$GITHUB_WORKSPACE/packaging/annotate_failure.sh" ghpages "$RUNNER_TEMP/ghpages.log"
            exit 1
          fi

      - name: 密钥未配置提示（占位，保持 job 绿）
        if: steps.gpgkey.outputs.ok != 'true'
        run: echo "⏸ 本次跳过 rpm 发布（GPG_PRIVATE_KEY 未配置）"
